<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<div th:insert="~{fragments/header :: header}"></div>
<div th:insert="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div th:if="${param.created}" class="alert alert-success alert-dismissible fade show my-3" role="alert">
        用户创建成功
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="关闭"></button>
    </div>
    <div th:if="${param.updated}" class="alert alert-success alert-dismissible fade show my-3" role="alert">
        用户更新成功
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="关闭"></button>
    </div>
    <div th:if="${param.deleted}" class="alert alert-success alert-dismissible fade show my-3" role="alert">
        用户删除成功
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="关闭"></button>
    </div>
    <div th:if="${param.notFound}" class="alert alert-info alert-dismissible fade show my-3" role="alert">
        未找到用户
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="关闭"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center my-3">
        <h1>用户管理</h1>
        <a class="btn btn-dark" href="/admin/users/new">新增用户</a>
    </div>

    <table class="table table-hover">
        <thead>
            <tr>
                <th>编号</th>
                <th>用户名</th>
                <th>邮箱</th>
                <th>角色</th>
                <th>启用状态</th>
                <th>双因素认证</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.id}"></td>
                <td th:text="${user.username}"></td>
                <td th:text="${user.email}"></td>
                <td th:text="${user.role}"></td>
                <td>
                    <span th:if="${user.enabled}" class="badge bg-success">是</span>
                    <span th:unless="${user.enabled}" class="badge bg-secondary">否</span>
                </td>
                <td>
                    <span th:if="${user.twoFactorEnabled}" class="badge bg-info">已开启</span>
                    <span th:unless="${user.twoFactorEnabled}" class="badge bg-secondary">未开启</span>
                </td>
                <td class="text-end">
                    <a class="btn btn-sm btn-outline-dark" th:href="@{'/admin/users/' + ${user.id}}">查看</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<div th:insert="~{fragments/footer :: footer}"></div>
</html>
