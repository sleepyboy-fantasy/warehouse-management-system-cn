<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Sign in</title>
</head>
<body>
<div class="container">
    <div class="col-md-4 mx-auto" style="margin-top: 6rem;">
        <h1 class="mb-4">登录</h1>

        <div th:if="${param.error}" class="alert alert-danger">用户名或密码错误。</div>
        <div th:if="${param.invalidCode}" class="alert alert-danger">验证码无效或已过期。</div>
        <div th:if="${param.logout}" class="alert alert-success">已退出登录。</div>
        <div th:if="${param.passwordReset}" class="alert alert-success">密码已重置，请登录。</div>
        <div th:if="${param.invalidResetToken}" class="alert alert-warning">重置链接无效或已过期。</div>

        <form th:action="@{/login}" method="post" class="needs-validation" novalidate>
            <div class="mb-3">
                <label for="username" class="form-label">用户名</label>
                <input class="form-control" type="text" id="username" name="username" required autofocus>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">密码</label>
                <input class="form-control" type="password" id="password" name="password" required>
            </div>
            <div class="d-grid">
                <button class="btn btn-dark" type="submit">登录</button>
            </div>
        </form>

        <div class="mt-3 text-center">
            <a href="/forgot-password">忘记密码？</a>
        </div>
    </div>
</div>
</body>
</html>
