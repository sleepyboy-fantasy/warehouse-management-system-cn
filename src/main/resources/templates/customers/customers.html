<!-- Header -->
<!-- Header fragment -->
<div th:insert="~{fragments/header :: header}"></div>
<!-- Navbar fragment -->
<div th:insert="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <!-- ALERTS TO PROVIDE USER FEEDBACK ON SUCCESSFUL CUSTOMER DELETION -->
    <div th:if="${param.deleted}">
        <div class="alert alert-success alert-dismissible fade show my-3" role="alert">
            客户删除成功
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>
     <!-- ALERTS TO PROVIDE USER FEEDBACK ON UNSUCCESSFUL CUSTOMER DELETION -->
     <div th:if="${param.failedToDelete}">
        <div class="alert alert-danger alert-dismissible fade show my-3" role="alert">
            无法删除已开票客户
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>
    <!-- ALERTS TO PROVIDE USER FEEDBACK ON CUSTOMER NOT FOUND -->
    <div th:if="${param.notFound}">
        <div class="alert alert-info alert-dismissible fade show my-3" role="alert">
            未找到客户信息
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>
    <!-- Page headers -->
    <div class="d-flex justify-content-between align-items-center my-3">
        <h1 class="m-0">客户列表</h1>
        <a class="btn btn-dark" th:href="@{/customers/new-customer}">
            <i class="bi bi-plus-lg me-1"></i>新增客户
        </a>
    </div>

    <!-- Simple search bar (binds to criteria.name) + Advanced button -->
    <form th:action="@{/customers}" method="get" th:object="${criteria}" class="card shadow-sm mb-3">
        <div class="card-body row g-2 align-items-end">
            <div class="col-md-8">
                <label class="form-label small mb-1">按客户名称搜索</label>
                <input type="search" class="form-control" th:field="*{name}"
                       placeholder="请输入客户名称..."
                       data-autocomplete-source="CUSTOMER"
                       data-autocomplete-mode="CONTAINS"
                       data-autocomplete-fill-on-select="true">
                <!-- Carry mode + other criteria the user already picked. -->
                <input type="hidden" th:field="*{nameMode}">
                <input type="hidden" th:field="*{id}">
                <input type="hidden" th:field="*{idMode}">
                <input type="hidden" th:field="*{city}">
                <input type="hidden" th:field="*{cityMode}">
                <input type="hidden" th:field="*{state}">
                <input type="hidden" th:field="*{stateMode}">
            </div>
            <div class="col-md-4 d-flex gap-2">
                <button type="submit" class="btn btn-dark flex-grow-1">
                    <i class="bi bi-search me-1"></i>搜索
                </button>
                <button type="button" class="btn btn-outline-secondary"
                        data-bs-toggle="modal" data-bs-target="#advancedSearchModal">
                    <i class="bi bi-funnel me-1"></i>高级搜索
                </button>
            </div>
        </div>
    </form>

    <!-- Active filter chip + Clear-filters link -->
    <div th:if="${criteria.isActive()}" class="d-flex justify-content-between align-items-center mb-2">
        <span class="text-muted small"
              th:text="|已筛选：${page.totalElements} 条匹配记录|">已筛选：12 条匹配记录</span>
        <a th:href="@{/customers}" class="btn btn-link btn-sm">
            <i class="bi bi-x-circle me-1"></i>清除筛选
        </a>
    </div>

    <!-- Customer list as table -->
    <table class="table">
        <thead>
            <tr>
                <th th:replace="~{fragments/pagination :: sortHeader(label='编号', property='id', page=${page}, baseUrl='/customers')}"></th>
                <th th:replace="~{fragments/pagination :: sortHeader(label='客户名称', property='name', page=${page}, baseUrl='/customers')}"></th>
                <th th:replace="~{fragments/pagination :: sortHeader(label='详细地址', property='street', page=${page}, baseUrl='/customers')}"></th>
                <th th:replace="~{fragments/pagination :: sortHeader(label='省', property='city', page=${page}, baseUrl='/customers')}"></th>
                <th th:replace="~{fragments/pagination :: sortHeader(label='市', property='state', page=${page}, baseUrl='/customers')}"></th>
                <th th:replace="~{fragments/pagination :: sortHeader(label='市/区/县', property='zipcode', page=${page}, baseUrl='/customers')}"></th>
                <th scope="col"></th>
                <th scope="col"></th>
                <th scope="col"></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="customer : ${page.content}">
                <th scope="row" th:text="${customer.id}">1</th>
                <td th:text="${customer.name}">Mark</td>
                <td th:text="${customer.street}">Otto</td>
                <td th:text="${customer.city}">@mdo</td>
                <td th:text="${customer.state}">@mdo</td>
                <td th:text="${customer.zipcode}">@mdo</td>
                <td><a th:href="@{|/customers/${customer.id}|}" class="btn btn-outline-secondary col-12">详情</a></td>
                <td><a th:href="@{|/customers/${customer.id}/update|}" class="btn btn-outline-success col-12">编辑</a></td>
                <td>
                    <form th:action="@{/customers/{id}(id=${customer.id})}" method="POST">
                        <button type="submit" class="btn btn-dark col-12" name="delete">删除</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
    <div th:replace="~{fragments/pagination :: pagination(page=${page}, baseUrl='/customers')}"></div>
</div>

<!-- ====== Advanced search modal ====== -->
<div class="modal fade" id="advancedSearchModal" tabindex="-1" aria-labelledby="advancedSearchModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="advancedSearchModalLabel"><i class="bi bi-funnel me-2"></i>高级搜索 - 客户</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form th:action="@{/customers}" method="get" th:object="${criteria}">
        <div class="modal-body">
          <p class="text-muted small mb-3">所有字段均为可选项，留空则显示全部客户。多个条件之间使用 AND 组合查询。</p>

          <div class="row g-2 align-items-end mb-3">
            <div class="col-md-3">
              <label class="form-label small mb-1">客户编号</label>
              <select class="form-select form-select-sm" th:field="*{idMode}">
                <option th:each="m : ${textModes}" th:value="${m}" th:text="${m.name().replace('_', ' ').toLowerCase()}">starts with</option>
              </select>
            </div>
            <div class="col-md-9">
              <label class="form-label small mb-1">&nbsp;</label>
              <input type="text" class="form-control" th:field="*{id}" placeholder="例如：10">
            </div>
          </div>

          <div class="row g-2 align-items-end mb-3">
            <div class="col-md-3">
              <label class="form-label small mb-1">客户名称</label>
              <select class="form-select form-select-sm" th:field="*{nameMode}">
                <option th:each="m : ${textModes}" th:value="${m}" th:text="${m.name().replace('_', ' ').toLowerCase()}">contains</option>
              </select>
            </div>
            <div class="col-md-9">
              <label class="form-label small mb-1">&nbsp;</label>
              <input type="text" class="form-control" th:field="*{name}" placeholder="例如：示例客户">
            </div>
          </div>

          <div class="row g-2 align-items-end mb-3">
            <div class="col-md-3">
              <label class="form-label small mb-1">城市</label>
              <select class="form-select form-select-sm" th:field="*{cityMode}">
                <option th:each="m : ${textModes}" th:value="${m}" th:text="${m.name().replace('_', ' ').toLowerCase()}">contains</option>
              </select>
            </div>
            <div class="col-md-9">
              <label class="form-label small mb-1">&nbsp;</label>
              <input type="text" class="form-control" th:field="*{city}" placeholder="例如：上海">
            </div>
          </div>

          <div class="row g-2 align-items-end">
            <div class="col-md-3">
              <label class="form-label small mb-1">地区</label>
              <select class="form-select form-select-sm" th:field="*{stateMode}">
                <option th:each="m : ${textModes}" th:value="${m}" th:text="${m.name().replace('_', ' ').toLowerCase()}">contains</option>
              </select>
            </div>
            <div class="col-md-9">
              <label class="form-label small mb-1">&nbsp;</label>
              <input type="text" class="form-control" th:field="*{state}" placeholder="例如：江苏">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
          <button type="submit" class="btn btn-dark"><i class="bi bi-search me-1"></i>搜索</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Footer fragment -->
<div th:insert="~{fragments/footer :: footer}"></div>
