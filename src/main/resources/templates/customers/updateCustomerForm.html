<!-- Header -->
<!-- Header fragment -->
<div th:insert="~{fragments/header :: header}"></div>
<!-- Navbar fragment -->
<div th:insert="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="container">
        <div class="container mx-auto col-md-6" id="update-customer-form">
            <div id="header">
                <h1 class="mt-3">编辑客户信息</h1>
            </div>

            <div id="updateCustomerForm">
                <!-- SALE ORDER FORM -->
                <form action="#" th:action="@{|/customers/${customer.id}/update|}" th:object="${customer}"
                    method="post" class="row g-3 needs-validation" novalidate>
                    <!-- FROM/TO INPUTS FIELDS-->
                    <div class="col-md-12">
                        <label for="name" class="form-label">客户名称</label>
                        <input class="form-control" th:field="*{name}" type="text" id="name" th:value="${customer.name}">
                        <div class="invalid-feedback">
                            请输入客户名称
                        </div>
                    </div>
                    <div class="col-md-8">
                        <label for="street" class="form-label">街道地址</label>
                        <input class="form-control" th:field="*{street}" type="text" id="street" th:value="${customer.street}">
                        <div class="invalid-feedback">
                            请输入街道地址
                        </div>
                    </div>
                    <div class="col-md-4">
                        <label for="city" class="form-label">城市</label>
                        <input class="form-control" th:field="*{city}" type="text" id="city" th:value="${customer.city}">
                        <div class="invalid-feedback">
                            请输入城市名称
                        </div>
                    </div>
                    <div class="col-md-3">
                        <label for="state" class="form-label">地区</label>
                        <!-- 地区下拉选择列表 -->
                        <select class="form-select" th:field="*{state}" aria-label="地区选择"
                            th:errorclass="fieldError" id="state" required name="state">
                            <option value="" selected th:text="${customer.state}"></option>
                            <option th:each="state: ${states}" th:text="|${state.name}|"
                                th:value="${state.abbreviation}">请选择
                            </option>
                        </select>
                        <div class="invalid-feedback">
                            请选择地区
                        </div>
                    </div>
                    <!-- 地区字段结束 -->
                    <div class="col-md-4">
                        <label for="zipcode" class="form-label">邮政编码</label>
                        <input class="form-control" th:field="*{zipcode}" type="text" id="zipcode" th:value="${customer.zipcode}">
                        <div class="invalid-feedback">
                            请输入邮政编码
                        </div>
                    </div>
                    <div class="col-md-5">
                        <label for="contactInfo" class="form-label">联系方式</label>
                        <input class="form-control" th:field="*{contactInfo}" type="text" id="contactInfo" th:value="${customer.contactInfo}">
                        <div class="invalid-feedback">
                            请输入联系方式
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="d-grid mx-auto">
                            <button type="submit" class="btn btn-dark col-12">保存客户修改</button>
                        </div>
                    </div>
                </form>
                <div class="my-3">
                    <a th:href="@{/customers}"
                        class="btn btn-outline-secondary col-12">返回</a>
                </div>
            </div>
        </div>
    </div>
</div>
<script>

    //JAVASCRIPT SNIPPET TO PROVIDES DATA VALIDATION ON FRONT END WHEN FORM IS SUBMITTED
    //IT WILL SUPPLY A MESSAGE BELOW THE BLANK INPUT FIELD
    (function () {
        'use strict'

        // Fetch all the forms we want to apply custom Bootstrap validation styles to
        // it checks every input field that its class attribute contains "needs-validation"

        //TODO: MOVE JS TO SEPARTE FILE
        var forms = document.querySelectorAll('.needs-validation')

        // Loop over them and prevent submission
        Array.prototype.slice.call(forms)
            .forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }

                    form.classList.add('was-validated')
                }, false)
            })
    })()
</script>


<!-- Footer fragment -->
<div th:insert="~{fragments/footer :: footer}"></div>
