<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>访问被拒绝</title>
</head>
<body class="bg-light">
<div class="container">
    <div class="col-md-6 mx-auto text-center" style="margin-top: 6rem;">
        <i class="bi bi-shield-lock display-1 text-warning"></i>
        <h1 class="display-4 mt-3">403</h1>
        <p class="lead">您的账户没有权限访问此页面。</p>
        <p class="text-muted">如果您认为这是错误，请联系管理员为您授予访问权限。</p>
        <a class="btn btn-dark mt-3" href="/">返回系统首页</a>
    </div>
</div>

</html>
