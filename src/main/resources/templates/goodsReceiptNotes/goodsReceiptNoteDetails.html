<!-- Header -->
<!-- Header fragment -->
<div th:insert="~{fragments/header :: header}"></div>
<!-- Navbar fragment -->
<div th:insert="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <!-- Page headers -->
    <h1 class="my-3 text-center" th:text="|收货单：${goodsReceiptNote.id}|">收货单</h1>
    <h3 class="my-3 text-center" th:text="|采购订单：${goodsReceiptNote.purchaseOrder.id}|">采购订单</h3>
    <h3 class="my-3 text-center" th:text="|日期：${#temporals.monthNameShort(goodsReceiptNote.date)} ${#temporals.format(goodsReceiptNote.date, ' dd, yyyy')}|">日期</h3>
    <!-- 收货单明细表格 -->
    <table class="table">
        <thead>
            <tr>
                <th scope="col">#</th>
                <th scope="col">商品</th>
                <th scope="col">商品描述</th>
                <th scope="col">收货数量</th>
                <th scope="col">备注</th>
                <!-- <th scope="col">Condition</th> -->
            </tr>
        </thead>
        <tbody>
                <tr th:each="goodsReceiptNoteLine : ${goodsReceiptNote.goodsReceiptNoteLines}">
                    <th scope="row" th:text="${counter.incrementAndGet()}">1</th>
                    <td th:text="${goodsReceiptNoteLine.item.sku}">Mark</td>
                    <td th:text="${goodsReceiptNoteLine.item.description}">Otto</td>
                    <td th:text="${goodsReceiptNoteLine.qty}">Otto</td>
                    <td th:text="${goodsReceiptNoteLine.notes}">Otto</td>
                    <!-- <td th:text="${goodsConditionMapper.getCondition(goodsReceiptNoteLine.condition)}">Damaged</td> -->
                    <!-- TODO：添加删除收货单按钮（首先需要实现收货单 CRUD 控制器） -->
                </tr>
        </tbody>
    </table>
</div>

<div class="container my-3">
    <a th:href="@{/goods-receipt-notes}"
        class="btn btn-outline-secondary col-12">返回</a>
</div>

<!-- Header fragment -->
<div th:insert="~{fragments/footer :: footer}"></div>
