<!-- Header -->
<!-- Header fragment -->
<div th:insert="~{fragments/header :: header}"></div>

<!-- Navbar fragment -->
<div th:insert="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <!-- ALERTS TO PROVIDE USER FEEDBACK ON NOT FOUND GRN -->
    <div th:if="${param.notFound}">
        <div class="alert alert-info alert-dismissible fade show mt-3" role="alert">
            未找到收货单
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>

    <!-- ALERTS TO PROVIDE USER FEEDBACK ON SUCCESSFUL FULFILLED GRN -->
    <div th:if="${param.fulfilled}">
        <div class="alert alert-success alert-dismissible fade show mt-3" role="alert">
            收货单已完成
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>

    <!-- ALERTS TO PROVIDE USER FEEDBACK ON PARTIALLY FULFILLED GRN -->
    <div th:if="${param.partiallyFulfilled}">
        <div class="alert alert-success alert-dismissible fade show mt-3" role="alert">
            收货单部分完成
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>

    <!-- ALERTS TO PROVIDE USER FEEDBACK ON NOT FULFILLED GRN -->
    <div th:if="${param.notFulfilled}">
        <div class="alert alert-info alert-dismissible fade show mt-3" role="alert">
            收货单未完成
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>

    <!-- ALERT: invalid enum query param (e.g. ?status=GARBAGE) -->
    <div th:if="${param.invalidFilter}">
        <div class="alert alert-warning alert-dismissible fade show mt-3" role="alert">
            一个筛选条件无法识别，将显示全部收货单。
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>

    <!-- Page header -->
    <h1 class="my-3" th:text="${title}">收货单</h1>

    <!-- Simple search bar (binds criteria.id) + Advanced button -->
    <form th:action="@{/goods-receipt-notes}" method="get" th:object="${criteria}" class="card shadow-sm mb-3">
        <div class="card-body row g-2 align-items-end">
            <div class="col-md-8">
                <label class="form-label small mb-1">按收货单编号搜索</label>
                <input type="search" class="form-control" th:field="*{id}" placeholder="请输入收货单编号...">
                <input type="hidden" th:field="*{idMode}">
                <input type="hidden" th:field="*{purchaseOrderId}">
                <input type="hidden" th:field="*{purchaseOrderIdMode}">
                <input type="hidden" th:field="*{vendor}">
                <input type="hidden" th:field="*{vendorMode}">
                <input type="hidden" th:field="*{dateFrom}">
                <input type="hidden" th:field="*{dateTo}">
                <input type="hidden" th:field="*{status}">
            </div>

            <div class="col-md-4 d-flex gap-2">
                <button type="submit" class="btn btn-dark flex-grow-1">
                    <i class="bi bi-search me-1"></i>搜索
                </button>

                <button type="button" class="btn btn-outline-secondary"
                        data-bs-toggle="modal" data-bs-target="#advancedSearchModal">
                    <i class="bi bi-funnel me-1"></i>高级搜索
                </button>
            </div>
        </div>
    </form>

    <div th:if="${criteria.isActive()}" class="d-flex justify-content-between align-items-center mb-2">
        <span class="text-muted small"
              th:text="|已筛选：${page.totalElements} 条匹配记录|">已筛选：3 条匹配记录</span>

        <a th:href="@{/goods-receipt-notes}" class="btn btn-link btn-sm">
            <i class="bi bi-x-circle me-1"></i>清除筛选
        </a>
    </div>

    <!-- GRN list as table -->
    <table class="table">
        <thead>
            <tr>
                <th th:replace="~{fragments/pagination :: sortHeader(label='日期', property='date', page=${page}, baseUrl='/goods-receipt-notes')}"></th>
                <th th:replace="~{fragments/pagination :: sortHeader(label='收货单', property='id', page=${page}, baseUrl='/goods-receipt-notes')}"></th>
                <th th:replace="~{fragments/pagination :: sortHeader(label='采购订单', property='purchaseOrder.id', page=${page}, baseUrl='/goods-receipt-notes')}"></th>
                <th th:replace="~{fragments/pagination :: sortHeader(label='供应商', property='purchaseOrder.vendor.name', page=${page}, baseUrl='/goods-receipt-notes')}"></th>
                <th th:replace="~{fragments/pagination :: sortHeader(label='状态', property='status', page=${page}, baseUrl='/goods-receipt-notes')}"></th>
                <th scope="col">收货数量</th>
                <th scope="col"></th>
                <th scope="col"></th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="goodsReceiptNote : ${page.content}">
                <th scope="row"
                    th:text="|${#temporals.monthNameShort(goodsReceiptNote.date)} ${#temporals.format(goodsReceiptNote.date, ' dd, yyyy')}|">
                    May 15, 2026
                </th>

                <td th:text="${goodsReceiptNote.id}">1</td>

                <td th:text="${goodsReceiptNote.purchaseOrder != null ? goodsReceiptNote.purchaseOrder.id : ''}">
                    42
                </td>

                <td th:text="${goodsReceiptNote.purchaseOrder != null and goodsReceiptNote.purchaseOrder.vendor != null ? goodsReceiptNote.purchaseOrder.vendor.name : ''}">
                    Acme
                </td>

                <td>
                    <span class="badge bg-secondary" th:text="${goodsReceiptNote.status.name()}">PENDING</span>
                </td>

                <td th:text="${goodsReceiptNote.getTotalQty()}">0</td>

                <td>
                    <a th:href="@{/goods-receipt-notes/{goodReceiptNoteId}(goodReceiptNoteId=${goodsReceiptNote.id})}"
                       class="btn btn-outline-secondary">
                        详情
                    </a>
                </td>

                <td>
                    <a th:if="${goodsReceiptNote.status.name() == 'PENDING'}"
                       th:href="@{|/goods-receipt-notes/${goodsReceiptNote.purchaseOrder.id}/receive|}"
                       class="btn btn-outline-primary">
                        完成收货
                    </a>
                </td>
            </tr>
        </tbody>
    </table>

    <div th:replace="~{fragments/pagination :: pagination(page=${page}, baseUrl='/goods-receipt-notes')}"></div>
</div>

<!-- ====== Advanced search modal ====== -->
<div class="modal fade" id="advancedSearchModal" tabindex="-1"
     aria-labelledby="advancedSearchModalLabel" aria-hidden="true">

    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title" id="advancedSearchModalLabel">
                    <i class="bi bi-funnel me-2"></i>高级搜索 - 收货单
                </h5>

                <button type="button" class="btn-close"
                        data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <form th:action="@{/goods-receipt-notes}" method="get" th:object="${criteria}">
                <div class="modal-body">

                    <p class="text-muted small mb-3">
                        所有字段均为可选项，留空则显示全部收货单。多个条件之间使用 AND 组合查询。
                    </p>

                    <div class="row g-2 align-items-end mb-3">
                        <div class="col-md-3">
                            <label class="form-label small mb-1">收货单编号</label>

                            <select class="form-select form-select-sm" th:field="*{idMode}">
                                <option th:each="m : ${textModes}"
                                        th:value="${m}"
                                        th:text="${m.name().replace('_', ' ').toLowerCase()}">
                                    starts with
                                </option>
                            </select>
                        </div>

                        <div class="col-md-9">
                            <label class="form-label small mb-1">&nbsp;</label>
                            <input type="text" class="form-control"
                                   th:field="*{id}"
                                   placeholder="例如：10">
                        </div>
                    </div>

                    <div class="row g-2 align-items-end mb-3">
                        <div class="col-md-3">
                            <label class="form-label small mb-1">采购订单编号</label>

                            <select class="form-select form-select-sm"
                                    th:field="*{purchaseOrderIdMode}">
                                <option th:each="m : ${textModes}"
                                        th:value="${m}"
                                        th:text="${m.name().replace('_', ' ').toLowerCase()}">
                                    starts with
                                </option>
                            </select>
                        </div>

                        <div class="col-md-9">
                            <label class="form-label small mb-1">&nbsp;</label>
                            <input type="text" class="form-control"
                                   th:field="*{purchaseOrderId}"
                                   placeholder="例如：42">
                        </div>
                    </div>

                    <div class="row g-2 align-items-end mb-3">
                        <div class="col-md-3">
                            <label class="form-label small mb-1">供应商名称</label>

                            <select class="form-select form-select-sm"
                                    th:field="*{vendorMode}">
                                <option th:each="m : ${textModes}"
                                        th:value="${m}"
                                        th:text="${m.name().replace('_', ' ').toLowerCase()}">
                                    contains
                                </option>
                            </select>
                        </div>

                        <div class="col-md-9">
                            <label class="form-label small mb-1">&nbsp;</label>
                            <input type="text" class="form-control"
                                   th:field="*{vendor}"
                                   placeholder="例如：Apple">
                        </div>
                    </div>

                    <div class="row g-2 align-items-end mb-3">
                        <div class="col-md-6">
                            <label class="form-label small mb-1">开始日期</label>
                            <input type="date" class="form-control" th:field="*{dateFrom}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small mb-1">结束日期</label>
                            <input type="date" class="form-control" th:field="*{dateTo}">
                        </div>
                    </div>

                    <div class="row g-2 align-items-end">
                        <div class="col-md-6">
                            <label class="form-label small mb-1">状态</label>

                            <select class="form-select" th:field="*{status}">
                                <option value="">全部状态</option>

                                <option th:each="s : ${statuses}"
                                        th:value="${s}"
                                        th:text="${s.name()}">
                                    PENDING
                                </option>
                            </select>
                        </div>
                    </div>

                </div>

                <div class="modal-footer">
                    <button type="button"
                            class="btn btn-outline-secondary"
                            data-bs-dismiss="modal">
                        取消
                    </button>

                    <button type="submit" class="btn btn-dark">
                        <i class="bi bi-search me-1"></i>搜索
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>

<!-- Footer fragment -->
<div th:insert="~{fragments/footer :: footer}"></div>
