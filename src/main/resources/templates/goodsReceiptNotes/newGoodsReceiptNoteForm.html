<!-- Header -->
<!-- Header fragment -->
<div th:insert="~{fragments/header :: header}"></div>
<!-- Navbar fragment -->
<div th:insert="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="container">
        <div class="container mx-auto col-md-6" id="goods-receipt-note-form">
            <div id="header">
                <h1 class="mt-3">新增收货单</h1>
            </div>

            <div id="goodsReceiptNoteForm">
                <!-- 收货单表单 -->
                <form action="#" th:action="@{/goods-receipt-notes/new-good-receipt-note}" th:object="${goodsReceiptNote}"
                    method="post" class="row g-3 needs-validation" novalidate>
                    <!-- PO INPUTS FIELDS-->
                    <div class="col-md-6">
                        <label for="purchaseOrder" class="form-label">采购订单编号</label>
                        <select class="form-select" th:field="*{purchaseOrder.id}" aria-label="采购订单编号选择"
                            th:errorclass="fieldError" id="purchaseOrder" required name="purchaseOrder">
                            <option value="" selected disable hidden>请选择...</option>
                            <option th:each="purchaseOrder: ${purchaseOrders}" th:text="|${purchaseOrder.id}|"
                                th:value="${purchaseOrder.id}">请选择
                            </option>
                        </select>
                        <div class="invalid-feedback">
                            请选择采购订单编号
                        </div>
                    </div>
                    <!-- 日期字段（日期将自动分配）-->
                    <div class="col-md-6">
                        <label for="date" class="form-label">日期</label>
                        <input class="form-control" type="text" id="date" th:field="*{date}" disabled readonly name="date">
                    </div>

                    <!-- 收货单明细 -->
                    <!-- <div th:each="saleOrderLine: ${newSalesOrderDto.saleOrderLines}"> -->
                    <div th:each="goodsReceiptNoteLine, grnStat: *{goodsReceiptNoteLines}">
                        <div class="input-group mb-3">
                            <input type="number" min="1" step="1" th:field="*{goodsReceiptNoteLines[__${grnStat.index}__].qty}"
                                class="form-control" id="qty" value="1">
                            <select class="form-select" th:field="*{goodsReceiptNoteLines[__${grnStat.index}__].item.id}"
                                aria-label="商品选择" id="item" required>
                                <option value="" selected disable hidden>请选择...</option>
                                <option th:each="item: ${items}"
                                    th:text="|${item.sku} - ${item.description}|" th:value="${item.id}">请选择
                                </option>
                            </select>
                                <button type="submit" name="removeRow" th:value="${grnStat.index}" class="btn btn-danger">移除</button>
                        </div>
                    </div>
                    <!-- 添加收货单明细按钮 -->
                    <div class="col-12">
                        <button type="submit" name="addRow" value="yes" class="btn btn-primary">添加收货明细</button>
                    </div>
                    <!-- </div> -->
                    <!-- 提交按钮 -->
                    <div class="col-12">
                        <div class="d-grid mx-auto">
                            <button type="submit" name="save" th:value="|yes|" class="btn btn-dark col-12">完成收货</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script>

    //JavaScript 代码片段：在提交表单时提供前端数据校验
    //当输入框为空时，在输入框下方显示提示信息
    (function () {
        'use strict'

        // 获取所有需要应用 Bootstrap 自定义校验样式的表单
        // 检查输入表单中的字段是否包含 needs-validation 类

        //TODO：将 JavaScript 移动到独立文件
        var forms = document.querySelectorAll('.needs-validation')

        // 遍历表单并阻止无效表单提交
        Array.prototype.slice.call(forms)
            .forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }

                    form.classList.add('was-validated')
                }, false)
            })
    })()
</script>


<!-- Footer fragment -->
<div th:insert="~{fragments/footer :: footer}"></div>
