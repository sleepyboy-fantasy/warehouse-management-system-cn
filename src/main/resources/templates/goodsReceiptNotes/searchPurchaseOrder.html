<!-- Header -->
<!-- Header fragment -->
<div th:insert="~{fragments/header :: header}"></div>
<!-- Navbar fragment -->
<div th:insert="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <!-- Page headers -->
    <div class="container col-md-6 mx-auto">
        <!-- 用于向用户反馈采购订单已收货 -->
        <div th:if="${param.alreadyReceived}">
            <div class="alert alert-danger alert-dismissible fade show mt-3" role="alert">
                采购订单已收货
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        </div>
        <!-- 用于向用户反馈未找到采购订单 -->
        <div th:if="${param.notFound}">
            <div class="alert alert-info alert-dismissible fade show mt-3" role="alert">
                未找到采购订单
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        </div>
        <!-- 用于向用户反馈采购订单已成功收货 -->
        <div th:if="${param.received}">
            <div class="alert alert-success alert-dismissible fade show mt-3" role="alert">
                采购订单已收货
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        </div>
        <h1 class="my-3 text-center">搜索采购订单</h1>
        <!-- 根据编号快速查询（输入框支持自动补全） -->
        <form action="#" th:action="@{/goods-receipt-notes/search-purchase-order}" th:object="${purchaseOrderNumberDto}"
            method="post" class="row g-3 needs-validation" novalidate>
            <div class="col-12">
                <label for="purchaseOrderId" class="form-label">采购订单</label>
                <input class="form-control" type="text" id="purchaseOrderId" th:field="*{purchaseOrderNumber}"
                    name="salesOrder" required
                    data-autocomplete-source="PURCHASE_ORDER"
                    data-autocomplete-mode="PREFIX"
                    data-autocomplete-fill-on-select="true"
                    autocomplete="off">
                <div class="invalid-feedback">
                    请输入采购订单编号
                </div>
            </div>
            <div class="col-12 d-flex gap-2">
                <button type="submit" class="btn btn-dark flex-grow-1">搜索采购订单</button>
                <button type="button" class="btn btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#advancedSearchModal">
                    <i class="bi bi-funnel me-1"></i>高级搜索
                </button>
            </div>
        </form>
    </div>

    <!-- ====== 采购订单——筛选条件为空时显示全部采购订单，并分页 ====== -->
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <h2 class="h4 m-0">
                <span th:if="${criteria.isActive()}">高级搜索结果</span>
                <span th:unless="${criteria.isActive()}">采购订单</span>
                <small class="text-muted" th:text="|(${advancedResults.totalElements})|"></small>
            </h2>
            <a th:if="${criteria.isActive()}" th:href="@{/goods-receipt-notes/search-purchase-order}"
               class="btn btn-link btn-sm">
                <i class="bi bi-x-circle me-1"></i>清除筛选
            </a>
        </div>
        <div th:if="${advancedResults.isEmpty()}" class="alert alert-info">没有符合筛选条件的采购订单。</div>
        <table th:unless="${advancedResults.isEmpty()}" class="table table-sm align-middle">
            <thead>
                <tr>
                    <th th:replace="~{fragments/pagination :: sortHeader(label='Id', property='id', page=${advancedResults}, baseUrl='/goods-receipt-notes/search-purchase-order')}"></th>
                    <th th:replace="~{fragments/pagination :: sortHeader(label='Date', property='date', page=${advancedResults}, baseUrl='/goods-receipt-notes/search-purchase-order')}"></th>
                    <th th:replace="~{fragments/pagination :: sortHeader(label='Vendor', property='vendor.name', page=${advancedResults}, baseUrl='/goods-receipt-notes/search-purchase-order')}"></th>
                    <th th:replace="~{fragments/pagination :: sortHeader(label='Status', property='status', page=${advancedResults}, baseUrl='/goods-receipt-notes/search-purchase-order')}"></th>
                    <th class="text-end">合计</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="po : ${advancedResults.content}">
                    <td th:text="${po.id}">1</td>
                    <td th:text="${#temporals.format(po.date, 'yyyy-MM-dd')}">2026-05-15</td>
                    <td th:text="${po.vendor != null ? po.vendor.name : ''}">Acme</td>
                    <td><span class="badge bg-secondary" th:text="${po.status.name()}">IN_TRANSIT</span></td>
                    <td class="text-end" th:text="${#numbers.formatCurrency(po.total)}">$0</td>
                    <td>
                        <a th:if="${po.status.name() != 'RECEIVED'}"
                           th:href="@{|/goods-receipt-notes/${po.id}/receive|}"
                           class="btn btn-outline-dark btn-sm">开始收货</a>
                    </td>
                </tr>
            </tbody>
        </table>
        <div th:replace="~{fragments/pagination :: pagination(page=${advancedResults}, baseUrl='/goods-receipt-notes/search-purchase-order')}"></div>
    </div>
</div>

<!-- ====== Oracle 风格高级搜索弹窗 ====== -->
<div class="modal fade" id="advancedSearchModal" tabindex="-1" aria-labelledby="advancedSearchModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="advancedSearchModalLabel"><i class="bi bi-funnel me-2"></i>高级搜索</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form th:action="@{/goods-receipt-notes/search-purchase-order}" method="get" th:object="${criteria}">
        <div class="modal-body">
          <p class="text-muted small mb-3">所有字段均为可选项，留空则跳过。多个条件之间使用 AND 组合查询。</p>

          <!-- 采购订单编号 -->
          <div class="row g-2 align-items-end mb-3">
            <div class="col-md-3">
              <label class="form-label small mb-1">采购订单编号</label>
              <select class="form-select form-select-sm" th:field="*{idMode}">
                <option th:each="m : ${textModes}" th:value="${m}" th:text="${m.name().replace('_', ' ').toLowerCase()}">starts with</option>
              </select>
            </div>
            <div class="col-md-9">
              <label class="form-label small mb-1">&nbsp;</label>
              <input type="text" class="form-control" th:field="*{id}" placeholder="e.g. 10">
            </div>
          </div>

          <!-- 供应商 -->
          <div class="row g-2 align-items-end mb-3">
            <div class="col-md-3">
              <label class="form-label small mb-1">供应商名称</label>
              <select class="form-select form-select-sm" th:field="*{vendorMode}">
                <option th:each="m : ${textModes}" th:value="${m}" th:text="${m.name().replace('_', ' ').toLowerCase()}">contains</option>
              </select>
            </div>
            <div class="col-md-9">
              <label class="form-label small mb-1">&nbsp;</label>
              <input type="text" class="form-control" th:field="*{vendor}" placeholder="e.g. Apple">
            </div>
          </div>

          <!-- 日期范围 -->
          <div class="row g-2 align-items-end mb-3">
            <div class="col-md-6">
              <label class="form-label small mb-1">开始日期</label>
              <input type="date" class="form-control" th:field="*{dateFrom}">
            </div>
            <div class="col-md-6">
              <label class="form-label small mb-1">结束日期</label>
              <input type="date" class="form-control" th:field="*{dateTo}">
            </div>
          </div>

          <!-- 状态 -->
          <div class="row g-2 align-items-end">
            <div class="col-md-6">
              <label class="form-label small mb-1">状态</label>
              <select class="form-select" th:field="*{status}">
                <option value="">全部状态</option>
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.name()}">IN_TRANSIT</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
          <button type="submit" class="btn btn-dark"><i class="bi bi-search me-1"></i>搜索</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>

    //JavaScript 代码片段：在提交表单时提供前端数据校验
    //当输入框为空时，在输入框下方显示提示信息
    (function () {
        'use strict'

        // 获取所有需要应用 Bootstrap 自定义校验样式的表单
        // 检查输入表单中的字段是否包含 "needs-validation" 类

        //TODO：将 JavaScript 移动到独立文件
        var forms = document.querySelectorAll('.needs-validation')

        // 遍历表单并阻止无效表单提交
        Array.prototype.slice.call(forms)
            .forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }

                    form.classList.add('was-validated')
                }, false)
            })
    })()
</script>

<!-- Header fragment -->
<div th:insert="~{fragments/footer :: footer}"></div>
