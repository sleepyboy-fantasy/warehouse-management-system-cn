<!-- 页面头部 -->
<!-- Header fragment -->
<div th:insert="~{fragments/header :: header}"></div>
<!-- Navbar fragment -->
<div th:insert="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <!-- 未找到拣货任务时显示提示 -->
    <div th:if="${param.notFound}">
        <div class="alert alert-info alert-dismissible fade show mt-3" role="alert">
            未找到拣货任务
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="关闭"></button>
        </div>
    </div>

    <!-- 拣货任务完成时显示提示 -->
    <div th:if="${param.fulfilled}">
        <div class="alert alert-success alert-dismissible fade show mt-3" role="alert">
            拣货任务已完成
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="关闭"></button>
        </div>
    </div>

    <!-- 无效筛选参数提示 -->
    <div th:if="${param.invalidFilter}">
        <div class="alert alert-warning alert-dismissible fade show mt-3" role="alert">
            一个或多个筛选值无法识别，正在显示全部拣货任务。
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="关闭"></button>
        </div>
    </div>

    <!-- 页面标题 -->
    <h1 class="my-3" th:text="${title}">拣货任务列表</h1>

    <!-- 简单搜索栏 -->
    <form th:action="@{/picking-jobs}" method="get" th:object="${criteria}" class="card shadow-sm mb-3">
        <div class="card-body row g-2 align-items-end">
            <div class="col-md-8">
                <label class="form-label small mb-1">按拣货任务编号搜索</label>
                <input type="search" class="form-control" th:field="*{id}" placeholder="请输入拣货任务编号...">
                <input type="hidden" th:field="*{idMode}">
                <input type="hidden" th:field="*{salesOrderId}">
                <input type="hidden" th:field="*{salesOrderIdMode}">
                <input type="hidden" th:field="*{customer}">
                <input type="hidden" th:field="*{customerMode}">
                <input type="hidden" th:field="*{dateFrom}">
                <input type="hidden" th:field="*{dateTo}">
                <input type="hidden" th:field="*{status}">
            </div>
            <div class="col-md-4 d-flex gap-2">
                <button type="submit" class="btn btn-dark flex-grow-1">
                    <i class="bi bi-search me-1"></i>搜索
                </button>
                <button type="button" class="btn btn-outline-secondary"
                        data-bs-toggle="modal" data-bs-target="#advancedSearchModal">
                    <i class="bi bi-funnel me-1"></i>高级搜索
                </button>
            </div>
        </div>
    </form>

    <div th:if="${criteria.isActive()}" class="d-flex justify-content-between align-items-center mb-2">
        <span class="text-muted small"
              th:text="|已筛选：${page.totalElements} 条匹配记录|">已筛选：3 条匹配记录</span>
        <a th:href="@{/picking-jobs}" class="btn btn-link btn-sm">
            <i class="bi bi-x-circle me-1"></i>清除筛选
        </a>
    </div>

    <!-- 拣货任务列表 -->
    <table class="table">
        <thead>
            <tr>
                <th th:replace="~{fragments/pagination :: sortHeader(label='日期', property='date', page=${page}, baseUrl='/picking-jobs')}"></th>
                <th th:replace="~{fragments/pagination :: sortHeader(label='拣货任务编号', property='id', page=${page}, baseUrl='/picking-jobs')}"></th>
                <th th:replace="~{fragments/pagination :: sortHeader(label='销售订单编号', property='salesOrder.id', page=${page}, baseUrl='/picking-jobs')}"></th>
                <th th:replace="~{fragments/pagination :: sortHeader(label='客户', property='salesOrder.customer.name', page=${page}, baseUrl='/picking-jobs')}"></th>
                <th th:replace="~{fragments/pagination :: sortHeader(label='状态', property='status', page=${page}, baseUrl='/picking-jobs')}"></th>
                <th scope="col"></th>
                <th scope="col"></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="pickingJob : ${page.content}">
                <th scope="row" th:text="|${#temporals.monthNameShort(pickingJob.date)} ${#temporals.format(pickingJob.date, ' dd, yyyy')}|">May 15, 2026</th>
                <td th:text="${pickingJob.id}">1</td>
                <td th:text="${pickingJob.salesOrder != null ? pickingJob.salesOrder.id : ''}">42</td>
                <td th:text="${pickingJob.salesOrder != null and pickingJob.salesOrder.customer != null ? pickingJob.salesOrder.customer.name : ''}">Acme</td>
                <td><span class="badge bg-secondary" th:text="${pickingJob.status.name()}">PENDING</span></td>
                <td><a th:href="@{/picking-jobs/{pickingJobId}(pickingJobId=${pickingJob.id})}" class="btn btn-outline-secondary">详情</a></td>
                <td>
                    <a th:if="${pickingJob.status.name() == 'PENDING'}"
                       th:href="@{/picking-jobs/fulfill-job/{pickingJobId}(pickingJobId=${pickingJob.id})}"
                       class="btn btn-outline-primary">完成拣货</a>
                </td>
            </tr>
        </tbody>
    </table>
    <div th:replace="~{fragments/pagination :: pagination(page=${page}, baseUrl='/picking-jobs')}"></div>
</div>

<!-- ====== 高级搜索弹窗 ====== -->
<div class="modal fade" id="advancedSearchModal" tabindex="-1" aria-labelledby="advancedSearchModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="advancedSearchModalLabel"><i class="bi bi-funnel me-2"></i>高级搜索 - 拣货任务</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
      </div>
      <form th:action="@{/picking-jobs}" method="get" th:object="${criteria}">
        <div class="modal-body">
          <p class="text-muted small mb-3">所有字段均为可选项，全部留空则显示所有拣货任务。多个筛选条件将同时生效。</p>

          <div class="row g-2 align-items-end mb-3">
            <div class="col-md-3">
              <label class="form-label small mb-1">拣货任务编号</label>
              <select class="form-select form-select-sm" th:field="*{idMode}">
                <option th:each="m : ${textModes}" th:value="${m}" th:text="${m.name().replace('_', ' ').toLowerCase()}">starts with</option>
              </select>
            </div>
            <div class="col-md-9">
              <label class="form-label small mb-1">&nbsp;</label>
              <input type="text" class="form-control" th:field="*{id}" placeholder="例如：10">
            </div>
          </div>

          <div class="row g-2 align-items-end mb-3">
            <div class="col-md-3">
              <label class="form-label small mb-1">销售订单编号</label>
              <select class="form-select form-select-sm" th:field="*{salesOrderIdMode}">
                <option th:each="m : ${textModes}" th:value="${m}" th:text="${m.name().replace('_', ' ').toLowerCase()}">starts with</option>
              </select>
            </div>
            <div class="col-md-9">
              <label class="form-label small mb-1">&nbsp;</label>
              <input type="text" class="form-control" th:field="*{salesOrderId}" placeholder="例如：42">
            </div>
          </div>

          <div class="row g-2 align-items-end mb-3">
            <div class="col-md-3">
              <label class="form-label small mb-1">客户名称</label>
              <select class="form-select form-select-sm" th:field="*{customerMode}">
                <option th:each="m : ${textModes}" th:value="${m}" th:text="${m.name().replace('_', ' ').toLowerCase()}">contains</option>
              </select>
            </div>
            <div class="col-md-9">
              <label class="form-label small mb-1">&nbsp;</label>
              <input type="text" class="form-control" th:field="*{customer}" placeholder="例如：Acme">
            </div>
          </div>

          <div class="row g-2 align-items-end mb-3">
            <div class="col-md-6">
              <label class="form-label small mb-1">开始日期</label>
              <input type="date" class="form-control" th:field="*{dateFrom}">
            </div>
            <div class="col-md-6">
              <label class="form-label small mb-1">结束日期</label>
              <input type="date" class="form-control" th:field="*{dateTo}">
            </div>
          </div>

          <div class="row g-2 align-items-end">
            <div class="col-md-6">
              <label class="form-label small mb-1">状态</label>
              <select class="form-select" th:field="*{status}">
                <option value="">— 任意 —</option>
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.name()}">PENDING</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
          <button type="submit" class="btn btn-dark"><i class="bi bi-search me-1"></i>查询</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Footer fragment -->
<div th:insert="~{fragments/footer :: footer}"></div>
