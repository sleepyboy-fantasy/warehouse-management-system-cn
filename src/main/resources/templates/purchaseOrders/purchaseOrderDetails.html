<!-- Header -->
<!-- Header fragment -->
<div th:insert="~{fragments/header :: header}"></div>
<!-- Navbar fragment -->
<div th:insert="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <!-- Page headers -->
    <h1 class="my-3 text-center" th:text="|采购订单：${purchaseOrder.id}|">采购订单</h1>
    <h3 class="my-3 text-center" th:text="|供应商：${purchaseOrder.vendor.name}|">供应商</h3>
    <h3 class="my-3 text-center" th:text="|日期：${#temporals.monthNameShort(purchaseOrder.date)} ${#temporals.format(purchaseOrder.date, ' dd, yyyy')}|">日期</h3>
    <!-- 采购订单明细表格 -->
    <table class="table">
        <thead>
            <tr>
                <th scope="col">#</th>
                <th scope="col">商品</th>
                <th scope="col">商品描述</th>
                <th scope="col">采购成本</th>
                <th scope="col">数量</th>
                <th scope="col">小计</th>
            </tr>
        </thead>
        <tbody>
                <tr th:each="purchaseOrderLine : ${purchaseOrder.purchaseOrderLines}">
                    <th scope="row" th:text="${counter.incrementAndGet()}">1</th>
                    <td th:text="${purchaseOrderLine.item.sku}">Mark</td>
                    <td th:text="${purchaseOrderLine.item.description}">Otto</td>
                    <td th:text="${#numbers.formatCurrency(purchaseOrderLine.itemCost.cost)}">Otto</td>
                    <td th:text="${purchaseOrderLine.qty}">Otto</td>
                    <td th:text="${#numbers.formatCurrency(purchaseOrderLine.subtotal)}">Otto</td>
                    <!-- TODO：添加删除采购订单按钮（首先需要实现采购订单 CRUD 控制器） -->
                </tr>
        </tbody>
    </table>
    <h3 class="text-center" th:text="|合计 ${#numbers.formatCurrency(purchaseOrder.getTotal())}|"></h3>
</div>
<div class="container my-3">
    <a th:href="@{/purchase-orders}"
        class="btn btn-outline-secondary col-12">返回</a>
</div>

<!-- Header fragment -->
<div th:insert="~{fragments/footer :: footer}"></div>
