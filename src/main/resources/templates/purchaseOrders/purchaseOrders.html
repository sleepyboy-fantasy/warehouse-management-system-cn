<!-- Header -->
<!-- Header fragment -->
<div th:insert="~{fragments/header :: header}"></div>
<!-- Navbar fragment -->
<div th:insert="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <!-- ALERTS TO PROVIDE USER FEEDBACK ON UNSUCCESSFUL PO DELETION -->
    <div th:if="${param.failedToDelete}">
        <div class="alert alert-danger alert-dismissible fade show mt-3" role="alert">
            无法删除已收货的采购订单！
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>
    <!-- ALERTS TO PROVIDE USER FEEDBACK ON NOT FOUND PO -->
    <div th:if="${param.notFound}">
        <div class="alert alert-info alert-dismissible fade show mt-3" role="alert">
            未找到采购订单
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>
    <!-- ALERTS TO PROVIDE USER FEEDBACK ON SUCCESSFUL ADDED PO -->
    <div th:if="${param.added}">
        <div class="alert alert-success alert-dismissible fade show mt-3" role="alert">
            采购订单已添加
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>
    <!-- ALERTS TO PROVIDE USER FEEDBACK ON SUCCESSFUL UPDATE SO -->
    <div th:if="${param.updated}">
        <div class="alert alert-success alert-dismissible fade show mt-3" role="alert">
            采购订单更新成功
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>
    <!-- ALERTS TO PROVIDE USER FEEDBACK ON SUCCESSFUL SO DELETION -->
    <div th:if="${param.purchaseOrderDeleted}">
        <div class="alert alert-success alert-dismissible fade show mt-3" role="alert">
            采购订单已删除
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>
    <!-- ALERTS TO PROVIDE USER FEEDBACK ON FAILED UPDATE -->
    <div th:if="${param.cannotBeUpdated}">
        <div class="alert alert-warning alert-dismissible fade show mt-3" role="alert">
            已收货的采购订单无法修改
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>
    <!-- ALERT: invalid enum query param (e.g. ?status=GARBAGE) -->
    <div th:if="${param.invalidFilter}">
        <div class="alert alert-warning alert-dismissible fade show mt-3" role="alert">
            一个筛选条件无法识别，将显示全部采购订单。
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>

    <!-- 页面标题区域 -->
    <div class="d-flex justify-content-between align-items-center my-3">
        <h1 class="m-0" th:text="${title}">采购订单</h1>
        <a class="btn btn-dark" th:href="@{/purchase-orders/new-purchase-order}">
            <i class="bi bi-plus-lg me-1"></i>新增采购订单
        </a>
    </div>

    <!-- 简单搜索栏（绑定 criteria.id）+ 高级搜索按钮 -->
    <form th:action="@{/purchase-orders}" method="get" th:object="${criteria}" class="card shadow-sm mb-3">
        <div class="card-body row g-2 align-items-end">
            <div class="col-md-8">
                <label class="form-label small mb-1">按采购订单编号搜索</label>
                <input type="search" class="form-control" th:field="*{id}"
                       placeholder="请输入采购订单编号..."
                       data-autocomplete-source="PURCHASE_ORDER"
                       data-autocomplete-mode="PREFIX"
                       data-autocomplete-fill-on-select="true">
                <input type="hidden" th:field="*{idMode}">
                <input type="hidden" th:field="*{vendor}">
                <input type="hidden" th:field="*{vendorMode}">
                <input type="hidden" th:field="*{dateFrom}">
                <input type="hidden" th:field="*{dateTo}">
                <input type="hidden" th:field="*{status}">
            </div>
            <div class="col-md-4 d-flex gap-2">
                <button type="submit" class="btn btn-dark flex-grow-1">
                    <i class="bi bi-search me-1"></i>搜索
                </button>
                <button type="button" class="btn btn-outline-secondary"
                        data-bs-toggle="modal" data-bs-target="#advancedSearchModal">
                    <i class="bi bi-funnel me-1"></i>高级搜索
                </button>
            </div>
        </div>
    </form>

    <div th:if="${criteria.isActive()}" class="d-flex justify-content-between align-items-center mb-2">
        <span class="text-muted small"
              th:text="|已筛选： ${page.totalElements} 条匹配记录|">已筛选：3条匹配记录</span>
        <a th:href="@{/purchase-orders}" class="btn btn-link btn-sm">
            <i class="bi bi-x-circle me-1"></i>清除筛选
        </a>
    </div>

    <!-- 采购订单列表表格 -->
    <table class="table">
        <thead>
            <tr>
                <th th:replace="~{fragments/pagination :: sortHeader(label='日期', property='date', page=${page}, baseUrl='/purchase-orders')}"></th>
                <th th:replace="~{fragments/pagination :: sortHeader(label='采购订单', property='id', page=${page}, baseUrl='/purchase-orders')}"></th>
                <th th:replace="~{fragments/pagination :: sortHeader(label='供应商', property='vendor.name', page=${page}, baseUrl='/purchase-orders')}"></th>
                <th scope="col">合计</th>
                <th th:replace="~{fragments/pagination :: sortHeader(label='状态', property='status', page=${page}, baseUrl='/purchase-orders')}"></th>
                <th scope="col"></th>
                <th scope="col"></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="purchaseOrder : ${page.content}">
                <th scope="row" th:text="|${#temporals.monthNameShort(purchaseOrder.date)} ${#temporals.format(purchaseOrder.date, ' dd, yyyy')}|">1</th>
                <td th:text="${purchaseOrder.id}">Mark</td>
                <td th:text="${purchaseOrder.vendor != null ? purchaseOrder.vendor.name : ''}">Acme</td>
                <td th:text="${#numbers.formatCurrency(purchaseOrder.total)}">$0</td>
                <td th:text="${purchaseOrder.status.name()}">IN_TRANSIT</td>
                <td><a th:href="@{/purchase-orders/{orderId}(orderId=${purchaseOrder.id})}" class="btn btn-outline-secondary">详情</a></td>
                <td>
                    <a th:if="${purchaseOrder.status.name() == 'IN_TRANSIT'}"
                       th:href="@{|/purchase-orders/${purchaseOrder.id}/update|}" class="btn btn-outline-secondary">编辑</a>
                    <form th:if="${purchaseOrder.status.name() != 'RECEIVED'}"
                          th:action="@{/purchase-orders/{orderId}(orderId=${purchaseOrder.id})}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-dark" name="delete">删除</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
    <div th:replace="~{fragments/pagination :: pagination(page=${page}, baseUrl='/purchase-orders')}"></div>
</div>

<!-- ====== 高级搜索弹窗 ====== -->
<div class="modal fade" id="advancedSearchModal" tabindex="-1" aria-labelledby="advancedSearchModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="advancedSearchModalLabel"><i class="bi bi-funnel me-2"></i>高级搜索 - 采购订单</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form th:action="@{/purchase-orders}" method="get" th:object="${criteria}">
        <div class="modal-body">
          <p class="text-muted small mb-3">所有字段均为可选项，留空则显示全部采购订单。多个条件之间使用 AND 组合查询。</p>

          <div class="row g-2 align-items-end mb-3">
            <div class="col-md-3">
              <label class="form-label small mb-1">采购订单编号</label>
              <select class="form-select form-select-sm" th:field="*{idMode}">
                <option th:each="m : ${textModes}" th:value="${m}" th:text="${m.name().replace('_', ' ').toLowerCase()}">starts with</option>
              </select>
            </div>
            <div class="col-md-9">
              <label class="form-label small mb-1">&nbsp;</label>
              <input type="text" class="form-control" th:field="*{id}" placeholder="例如：10">
            </div>
          </div>

          <div class="row g-2 align-items-end mb-3">
            <div class="col-md-3">
              <label class="form-label small mb-1">供应商名称</label>
              <select class="form-select form-select-sm" th:field="*{vendorMode}">
                <option th:each="m : ${textModes}" th:value="${m}" th:text="${m.name().replace('_', ' ').toLowerCase()}">contains</option>
              </select>
            </div>
            <div class="col-md-9">
              <label class="form-label small mb-1">&nbsp;</label>
              <input type="text" class="form-control" th:field="*{vendor}" placeholder="例如：Apple">
            </div>
          </div>

          <div class="row g-2 align-items-end mb-3">
            <div class="col-md-6">
              <label class="form-label small mb-1">开始日期</label>
              <input type="date" class="form-control" th:field="*{dateFrom}">
            </div>
            <div class="col-md-6">
              <label class="form-label small mb-1">结束日期</label>
              <input type="date" class="form-control" th:field="*{dateTo}">
            </div>
          </div>

          <div class="row g-2 align-items-end">
            <div class="col-md-6">
              <label class="form-label small mb-1">状态</label>
              <select class="form-select" th:field="*{status}">
                <option value="">全部状态</option>
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.name()}">IN_TRANSIT</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
          <button type="submit" class="btn btn-dark"><i class="bi bi-search me-1"></i>搜索</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Header fragment -->
<div th:insert="~{fragments/footer :: footer}"></div>
