<!-- Header -->
<!-- Header fragment -->
<div th:insert="~{fragments/header :: header}"></div>
<!-- Navbar fragment -->
<div th:insert="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="container">
        <div class="container mx-auto col-md-6" id="sale-order-form">
            <div id="header">
                <h1 class="mt-3" th:text="|编辑采购订单：${persistedOrder.id}|">编辑采购订单</h1>
            </div>

            <div id="updatePurchaseOrderForm">
                <!-- 采购订单编辑表单 -->
                <form action="#" th:action="@{|/purchase-orders/${persistedOrder.id}/update|}" th:object="${purchaseOrder}"
                    method="post" class="row g-3 needs-validation" novalidate>
                    <!-- 采购订单基本信息-->
                    <div class="col-md-6">
                        <label for="vendor" class="form-label">供应商</label>
                        <select class="form-select" th:field="*{vendor.id}" aria-label="供应商选择"
                            th:errorclass="fieldError" id="vendor" required name="vendor">
                            <option value="" selected th:text="|${purchaseOrder.vendor.id} - ${purchaseOrder.vendor.name}|" th:value="${purchaseOrder.vendor.id}">请选择...</option>
                            <option th:each="vendor: ${vendors}" th:text="|${vendor.id} - ${vendor.name}|"
                                th:value="${vendor.id}">请选择
                            </option>
                        </select>
                        <div class="invalid-feedback">
                            请选择供应商
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label for="date" class="form-label">日期</label>
                        <input class="form-control" type="text" id="date" th:field="*{date}" disabled readonly name="date">
                    </div>

                    <!-- 采购订单明细 -->
                    <!-- <div th:each="purchaseOrderLine: ${newpurchaseOrderDto.purchaseOrderLines}"> -->
                    <div th:each="purchaseOrderLine, polStat: *{purchaseOrderLines}">
                        <div class="input-group mb-3">
                            <input type="number" min="1" step="1" th:field="*{purchaseOrderLines[__${polStat.index}__].qty}"
                                class="form-control" id="qty" th:value="*{purchaseOrderLines[__${polStat.index}__].qty}">
                            <select class="form-select" th:field="*{purchaseOrderLines[__${polStat.index}__].item.id}"
                                aria-label="商品选择" id="item" required>
                                <div class="purchaseOrderLine" th:if="*{purchaseOrderLines[__${polStat.index}__].item.sku == null}">
                                    <option th:value="" th:text="请选择..." selected disable hidden>请选择...</option>
                                </div>     
                                <div class="purchaseOrderLine" th:unless="*{purchaseOrderLines[__${polStat.index}__].item.sku == null}">
                                    <option value="" selected th:text="|*{purchaseOrderLines[__${polStat.index}__].item.sku} - *{purchaseOrderLines[__${polStat.index}__].item.description}|" th:value="*{purchaseOrderLines[__${polStat.index}__].item.id}">请选择...</option>
                                </div>                           
                                <option th:each="item: ${items}"
                                    th:text="|${item.sku} - ${item.description}|" th:value="${item.id}">请选择
                                </option>
                            </select>
                                <button type="submit" name="removeRow" th:value="${polStat.index}" class="btn btn-danger">移除</button>
                        </div>
                    </div>
                    <!-- 添加订单明细按钮 -->
                    <div class="col-12">
                        <button type="submit" name="addRow" value="yes" class="btn btn-primary">添加订单明细</button>
                    </div>
                    <!-- </div> -->
                    <!-- 保存按钮 -->
                    <div class="col-12">
                        <div class="d-grid mx-auto">
                            <button type="submit" name="save" th:value="|yes|" class="btn btn-dark col-12">保存采购订单修改</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script>

    //JavaScript 代码片段：在提交表单时提供前端数据校验
    //当输入框为空时，在输入框下方显示提示信息
    (function () {
        'use strict'

        // 获取所有需要应用 Bootstrap 自定义校验样式的表单
        // 检查 class 属性包含 needs-validation 的输入表单

        //TODO：将 JavaScript 移动到独立文件
        var forms = document.querySelectorAll('.needs-validation')

        // 遍历表单并阻止无效表单提交
        Array.prototype.slice.call(forms)
            .forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }

                    form.classList.add('was-validated')
                }, false)
            })
    })()
</script>


<!-- Footer fragment -->
<div th:insert="~{fragments/footer :: footer}"></div>
