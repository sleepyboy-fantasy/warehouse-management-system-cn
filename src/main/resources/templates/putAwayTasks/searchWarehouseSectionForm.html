<!-- 页面头部 -->
<!-- Header fragment -->
<div th:insert="~{fragments/header :: header}"></div>
<!-- Navbar fragment -->
<div th:insert="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <!-- 页面内容 -->
    <div class="container col-md-6 mx-auto">
        <!-- 未找到库位时显示提示 -->
        <div th:if="${param.notFound}">
            <div class="alert alert-info alert-dismissible fade show mt-3" role="alert">
                未找到库位信息
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="关闭"></button>
            </div>
        </div>

        <!-- 成功上架后显示提示 -->
        <div th:if="${param.putAway}">
            <div class="alert alert-info alert-success fade show mt-3" role="alert">
                库存已成功上架
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="关闭"></button>
            </div>
        </div>

        <h1 class="my-3 text-center">搜索仓库库位</h1>

        <!-- 库位搜索表单 -->
        <form action="#" th:action="@{/put-aways/search-warehouse-section}" th:object="${searchWarehouseSectionDto}"
            method="post" class="row g-3 needs-validation" novalidate>
            <div class="col-12">
                <label for="warehouseSection" class="form-label">仓库库位</label>
                <input class="form-control" type="text" id="warehouseSection" th:field="*{warehouseSectionNumber}"
                    name="salesOrder" required
                    data-autocomplete-source="WAREHOUSE_SECTION"
                    data-autocomplete-mode="CONTAINS"
                    data-autocomplete-fill-on-select="true"
                    autocomplete="off">
                <div class="invalid-feedback">
                    请输入仓库库位
                </div>
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-dark col-12">搜索</button>
            </div>
        </form>
    </div>
</div>

<script>

    // JavaScript：表单提交时进行前端数据校验
    // 当输入框为空或输入内容不符合要求时，在输入框下方显示提示信息
    (function () {
        'use strict'

        // 获取所有需要使用 Bootstrap 校验样式的表单
        // 检查 class 属性中是否包含 "needs-validation"

        // TODO：将 JavaScript 移动到独立文件
        var forms = document.querySelectorAll('.needs-validation')

        // 遍历表单并阻止无效数据提交
        Array.prototype.slice.call(forms)
            .forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }

                    form.classList.add('was-validated')
                }, false)
            })
    })()
</script>

<!-- Footer fragment -->
<div th:insert="~{fragments/footer :: footer}"></div>
