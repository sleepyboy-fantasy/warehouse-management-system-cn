<!-- 页面头部 -->
<!-- Header fragment -->
<div th:insert="~{fragments/header :: header}"></div>
<!-- Navbar fragment -->
<div th:insert="~{fragments/navbar :: navbar}"></div>

<div class="container">
    
    <div class="col-md-6 mx-auto">
        <!-- 页面标题 -->
        <h1 class="my-3 text-center">按年度和月份查询待处理销售订单</h1>

        <!-- 报表查询表单 -->
        <form action="#" th:action="@{/reports/pending-sales-orders-by-year-month}" th:object="${pendingSalesOrderByYearAndMonthDto}"
            method="post" class="horizontal needs-validation" novalidate>

            <!-- 年份 -->
            <div class="my-3">
                <label for="year" class="form-label">年份</label>
                <input class="form-control" th:field="*{year}" type="number" value="2023" min="2023" max="2023"
                    id="year" aria-label="默认选择示例" required>
                <div class="invalid-feedback">
                    请输入年份
                </div>
            </div>

            <!-- 月份 -->
            <div class="my-3">
                <label for="month" class="form-label">月份</label>
                <select class="form-select" th:field="*{month}" id="month" aria-label="默认选择示例"
                    required>
                    <option value="0" selected disable>请选择...</option>
                    <option value="01">一月</option>
                    <option value="02">二月</option>
                    <option value="03">三月</option>
                    <option value="04">四月</option>
                    <option value="05">五月</option>
                    <option value="06">六月</option>
                    <option value="07">七月</option>
                    <option value="08">八月</option>
                    <option value="09">九月</option>
                    <option value="10">十月</option>
                    <option value="11">十一月</option>
                    <option value="12">十二月</option>
                </select>
                <div class="invalid-feedback">
                    请选择月份
                </div>
            </div>

            <!-- 打印报表按钮 -->
            <div class="">
                <div class="d-grid mx-auto">
                    <input type="submit" id="print-report" value="打印报表" class="btn btn-dark" />
                </div>
            </div>
        </form>
    </div>

</div>

<script>
    // JavaScript：表单提交时进行前端数据校验
    // 当输入框为空或输入内容不符合要求时，在输入框下方显示提示信息
    (function () {
        'use strict'

        // 获取所有需要使用 Bootstrap 校验样式的表单
        // 检查 class 属性中是否包含 "needs-validation"

        // TODO：将 JavaScript 移动到独立文件
        var forms = document.querySelectorAll('.needs-validation')

        // 遍历表单并阻止无效数据提交
        Array.prototype.slice.call(forms)
            .forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }

                    form.classList.add('was-validated')
                }, false)
            })
    })()
</script>

<!-- Footer fragment -->
<div th:insert="~{fragments/footer :: footer}"></div>
