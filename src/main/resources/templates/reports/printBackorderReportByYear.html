<!-- 页面头部 -->
<!-- Header fragment -->
<div th:insert="~{fragments/header :: header}"></div>
<!-- Navbar fragment -->
<div th:insert="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <!-- 页面标题 -->
    <h1 class="my-3 text-center" th:text="|年份：${year}|">年份：2023</h1>

    <!-- 缺货订单报表 -->
    <table class="table">
        <thead>
            <tr>
                <th scope="col">日期</th>
                <th scope="col">客户</th>
                <th scope="col">销售订单</th>
                <th scope="col">总金额</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="backorder : ${backorders}">
                <th scope="row" th:text="|${#temporals.monthNameShort(backorder.date)} ${#temporals.format(backorder.date, ' dd, yyyy')}|">1</th>
                <td th:text="${backorder.customer}">Mark</td>
                <td th:text="${backorder.salesOrder}">Mark</td>
                <td th:text="${#numbers.formatCurrency(backorder.total)}">Otto</td>
                <!-- TODO：添加删除销售订单的按钮 -->
            </tr>
        </tbody>
    </table>
</div>

<!-- Footer fragment -->
<div th:insert="~{fragments/footer :: footer}"></div>
