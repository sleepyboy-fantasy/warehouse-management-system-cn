<!-- 页面头部 -->
<!-- Header fragment -->
<div th:insert="~{fragments/header :: header}"></div>
<!-- Navbar fragment -->
<div th:insert="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <!-- 页面标题 -->
    <h1 class="my-3 text-center" th:text="|待处理销售订单|">待处理销售订单</h1>
    <h3 class="my-3 text-center" th:text="|查询周期起始日期：${month} 1, ${year}|">查询周期起始日期</h3>

    <!-- 待处理销售订单报表 -->
    <table class="table">
        <thead>
            <tr>
                <th scope="col">日期</th>
                <th scope="col">客户</th>
                <th scope="col">销售订单</th>
                <th scope="col">总金额</th>
                <th scope="col">延迟天数</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="saleOrder : ${salesOrders}">
                <th scope="row" th:text="${saleOrder.date}">1</th>
                <th th:text="${saleOrder.customer}">1</th>
                <td th:text="${saleOrder.salesOrder}">Mark</td>
                <td th:text="${#numbers.formatCurrency(saleOrder.total)}">Otto</td>
                <td th:text="${saleOrder.delay}">Otto</td>
                <!-- TODO：添加删除销售订单的按钮 -->
            </tr>
        </tbody>
    </table>
</div>

<!-- Footer fragment -->
<div th:insert="~{fragments/footer :: footer}"></div>
