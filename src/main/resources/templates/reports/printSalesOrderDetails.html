<!-- 页面头部 -->
<!-- Header fragment -->
<div th:insert="~{fragments/header :: header}"></div>
<!-- Navbar fragment -->
<div th:insert="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <!-- 页面标题 -->
    <h1 class="my-3 text-center" th:text="|客户：${salesOrder.customer.name}|">客户</h1>
    <h3 class="my-3 text-center" th:text="|地址：${salesOrder.customer.formattedAddress}|">客户地址</h3>
    <h3 class="my-3 text-center" th:text="|日期：${salesOrder.date}|">日期</h3>

    <!-- 销售订单明细表 -->
    <table class="table">
        <thead>
            <tr>
                <th scope="col">描述</th>
                <th scope="col">商品编号</th>
                <th scope="col">数量</th>
                <th scope="col">销售价格</th>
                <th scope="col">小计</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="salesOrderLine : ${salesOrder.saleOrderLines}">
                <th scope="row" th:text="${salesOrderLine.item.description}">1</th> <!--scope="row" -->
                <td th:text="${salesOrderLine.item.sku}">Mark</td>
                <td th:text="${salesOrderLine.qty}">Mark</td>
                <td th:text="${#numbers.formatCurrency(salesOrderLine.itemPrice.price)}">Otto</td>
                <td th:text="${#numbers.formatCurrency(salesOrderLine.subtotal)}">Otto</td>
            </tr>
        </tbody>
    </table>
    <h4 class="my-3 text-center" th:text="|总金额：${#numbers.formatCurrency(salesOrder.total)}|">客户列表</h4>
</div>

<!-- 页脚 -->
<div th:insert="~{fragments/footer :: footer}"></div>
