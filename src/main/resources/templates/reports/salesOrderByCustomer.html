<!-- 页面头部 -->
<!-- Header fragment -->
<div th:insert="~{fragments/header :: header}"></div>
<!-- Navbar fragment -->
<div th:insert="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <!-- 提示用户客户删除成功 -->
    <div th:if="${param.customerDeleted}">
        <div class="alert alert-success alert-dismissible fade show my-3" role="alert">
            客户已删除
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="关闭"></button>
        </div>
    </div>

    <div class="col-md-6 mx-auto">
        <!-- 页面标题 -->
        <h1 class="my-3 text-center">按客户查询销售订单</h1>

        <!-- 销售订单表单 -->
        <form action="#" th:action="@{/reports/sales-order-by-customer}" th:object="${salesOrderByCustomerDto}"
            method="post" class="horizontal needs-validation" novalidate>

            <!-- 客户编号 -->
            <div class="my-3">
                <label for="customerId" class="form-label">客户编号</label>
                <select class="form-select" th:field="*{customerId}" id="customerId" aria-label="默认选择示例"
                    required>
                    <option value="" selected disable>请选择...</option>
                    <option th:each="customer: ${customers}" th:text="|${customer.id} - ${customer.name}|"
                        th:value="${customer.id}">Two
                    </option>
                </select>
                <div class="invalid-feedback">
                    请选择客户
                </div>
            </div>

            <!-- 查询按钮 -->
            <div class="">
                <div class="d-grid mx-auto">
                    <input type="submit" id="print-report" value="打印报表" class="btn btn-dark" />
                </div>
            </div>
        </form>
    </div>

</div>

<script>
    // JavaScript 代码：表单提交时提供前端数据验证
    // 当输入字段为空时，在字段下方显示提示信息
    (function () {
        'use strict'

        // 获取所有需要应用 Bootstrap 自定义验证样式的表单
        // 检查 class 属性中包含 "needs-validation" 的输入表单

        // TODO：将 JavaScript 移动到单独的文件
        var forms = document.querySelectorAll('.needs-validation')

        // 遍历表单并阻止无效提交
        Array.prototype.slice.call(forms)
            .forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }

                    form.classList.add('was-validated')
                }, false)
            })
    })()
</script>

<!-- 页脚 -->
<div th:insert="~{fragments/footer :: footer}"></div>
