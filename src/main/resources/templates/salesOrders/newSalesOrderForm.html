<!-- Header -->
<!-- Header fragment -->
<div th:insert="~{fragments/header :: header}"></div>
<!-- Navbar fragment -->
<div th:insert="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="container">
        <div class="container mx-auto col-md-6" id="sale-order-form">
            <div id="header">
                <h1 class="mt-3">新增销售订单</h1>
            </div>

            <div id="salesOrderForm">
                <!-- 销售订单表单 -->
                <form action="#" th:action="@{/sales-orders/new-sales-order}" th:object="${salesOrder}"
                    method="post" class="row g-3 needs-validation" novalidate>
                    <!-- FROM/TO INPUTS FIELDS-->
                    <div class="col-md-6">
                        <label for="customer" class="form-label">客户</label>
                        <select class="form-select" th:field="*{customer.id}" aria-label="客户选择"
                            th:errorclass="fieldError" id="customer" required name="customer">
                            <option value="" selected disable hidden>请选择...</option>
                            <option th:each="customer: ${customers}" th:text="|${customer.id} - ${customer.name}|"
                                th:value="${customer.id}">请选择
                            </option>
                        </select>
                        <div class="invalid-feedback">
                            请选择客户
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label for="date" class="form-label">Date</label>
                        <input class="form-control" type="text" id="date" th:field="*{date}" disabled readonly name="date">
                    </div>

                    <!-- 销售订单明细 -->
                    <!-- <div th:each="saleOrderLine: ${newSalesOrderDto.saleOrderLines}"> -->
                    <div th:each="saleOrderLine, solStat: *{saleOrderLines}">
                        <div class="input-group mb-3">
                            <input type="number" min="1" step="1" th:field="*{saleOrderLines[__${solStat.index}__].qty}"
                                class="form-control" id="qty" value="1">
                            <select class="form-select" th:field="*{saleOrderLines[__${solStat.index}__].item.id}"
                                aria-label="商品选择" id="item" required>
                                <option value="" selected disable hidden>请选择...</option>
                                <option th:each="item: ${items}"
                                    th:text="|${item.sku} - ${item.description}|" th:value="${item.id}">请选择
                                </option>
                            </select>
                                <button type="submit" name="removeRow" th:value="${solStat.index}" class="btn btn-danger">移除</button>
                        </div>
                    </div>
                    <!-- 添加订单明细按钮 -->
                    <div class="col-12">
                        <button type="submit" name="addRow" value="yes" class="btn btn-primary">添加订单明细</button>
                    </div>
                    <!-- </div> -->
                    <!-- 搜索按钮 -->
                    <div class="col-12">
                        <div class="d-grid mx-auto">
                            <button type="submit" name="save" th:value="|yes|" class="btn btn-dark col-12">提交销售订单</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script>

    //提交表单时进行前端数据验证的 JavaScript 代码
    //用于在空白输入字段下方显示提示信息
    (function () {
        'use strict'

        // Fetch all the forms we want to apply custom Bootstrap validation styles to
        // it checks every input field that its class attribute contains "needs-validation"

        //TODO: MOVE JS TO SEPARTE FILE
        var forms = document.querySelectorAll('.needs-validation')

        // Loop over them and prevent submission
        Array.prototype.slice.call(forms)
            .forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }

                    form.classList.add('was-validated')
                }, false)
            })
    })()
</script>


<!-- Footer fragment -->
<div th:insert="~{fragments/footer :: footer}"></div>
