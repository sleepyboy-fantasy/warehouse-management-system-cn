<!-- Header -->
<!-- Header fragment -->
<div th:insert="~{fragments/header :: header}"></div>
<!-- Navbar fragment -->
<div th:insert="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <!-- 销售订单删除失败提示 -->
    <div th:if="${param.failedToDelete}">
        <div class="alert alert-danger alert-dismissible fade show mt-3" role="alert">
            无法删除已发货的销售订单！
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>
    <!-- 销售订单未找到提示 -->
    <div th:if="${param.notFound}">
        <div class="alert alert-info alert-dismissible fade show mt-3" role="alert">
            未找到销售订单
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>
    <!-- 销售订单添加成功提示 -->
    <div th:if="${param.added}">
        <div class="alert alert-success alert-dismissible fade show mt-3" role="alert">
            销售订单已添加到数据库
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>
    <!-- 销售订单更新成功提示 -->
    <div th:if="${param.updated}">
        <div class="alert alert-success alert-dismissible fade show mt-3" role="alert">
            销售订单已更新
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>
    <!-- 销售订单删除成功提示 -->
    <div th:if="${param.salesOrderDeleted}">
        <div class="alert alert-success alert-dismissible fade show mt-3" role="alert">
            销售订单已删除
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>
    <!-- 销售订单更新失败提示 -->
    <div th:if="${param.cannotBeUpdated}">
        <div class="alert alert-warning alert-dismissible fade show mt-3" role="alert">
            已发货的销售订单无法修改
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>
    <!-- 无效状态筛选参数提示（例如 ?status=GARBAGE） -->
    <div th:if="${param.invalidFilter}">
        <div class="alert alert-warning alert-dismissible fade show mt-3" role="alert">
            一个筛选条件的值无法识别，将显示全部销售订单。
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>

    <!-- 页面标题 -->
    <div class="d-flex justify-content-between align-items-center my-3">
        <h1 class="m-0" th:text="${title}">销售订单</h1>
        <a class="btn btn-dark" th:href="@{/sales-orders/new-sales-order}">
            <i class="bi bi-plus-lg me-1"></i>新增销售订单
        </a>
    </div>

    <!-- 简单搜索栏（绑定 criteria.id）+ 高级搜索按钮 -->
    <form th:action="@{/sales-orders}" method="get" th:object="${criteria}" class="card shadow-sm mb-3">
        <div class="card-body row g-2 align-items-end">
            <div class="col-md-8">
                <label class="form-label small mb-1">按销售订单编号搜索</label>
                <input type="search" class="form-control" th:field="*{id}"
                       placeholder="请输入销售订单编号..."
                       data-autocomplete-source="SALES_ORDER"
                       data-autocomplete-mode="PREFIX"
                       data-autocomplete-fill-on-select="true">
                <input type="hidden" th:field="*{idMode}">
                <input type="hidden" th:field="*{customer}">
                <input type="hidden" th:field="*{customerMode}">
                <input type="hidden" th:field="*{dateFrom}">
                <input type="hidden" th:field="*{dateTo}">
                <input type="hidden" th:field="*{status}">
            </div>
            <div class="col-md-4 d-flex gap-2">
                <button type="submit" class="btn btn-dark flex-grow-1">
                    <i class="bi bi-search me-1"></i>搜索
                </button>
                <button type="button" class="btn btn-outline-secondary"
                        data-bs-toggle="modal" data-bs-target="#advancedSearchModal">
                    <i class="bi bi-funnel me-1"></i>高级搜索
                </button>
            </div>
        </div>
    </form>

    <div th:if="${criteria.isActive()}" class="d-flex justify-content-between align-items-center mb-2">
        <span class="text-muted small"
              th:text="|已筛选：${page.totalElements} 条匹配记录|">已筛选：3 条匹配记录</span>
        <a th:href="@{/sales-orders}" class="btn btn-link btn-sm">
            <i class="bi bi-x-circle me-1"></i>清除筛选
        </a>
    </div>

    <!-- 销售订单列表表格 -->
    <table class="table">
        <thead>
            <tr>
                <th th:replace="~{fragments/pagination :: sortHeader(label='日期', property='date', page=${page}, baseUrl='/sales-orders')}"></th>
                <th th:replace="~{fragments/pagination :: sortHeader(label='销售订单编号', property='id', page=${page}, baseUrl='/sales-orders')}"></th>
                <th th:replace="~{fragments/pagination :: sortHeader(label='客户', property='customer.name', page=${page}, baseUrl='/sales-orders')}"></th>
                <th scope="col">合计</th>
                <th th:replace="~{fragments/pagination :: sortHeader(label='状态', property='status', page=${page}, baseUrl='/sales-orders')}"></th>
                <th scope="col"></th>
                <th scope="col"></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="salesOrder : ${page.content}">
                <th scope="row" th:text="|${#temporals.monthNameShort(salesOrder.date)} ${#temporals.format(salesOrder.date, ' dd, yyyy')}|">1</th>
                <td th:text="${salesOrder.id}">1001</td>
                <td th:text="${salesOrder.customer != null ? salesOrder.customer.name : ''}">Acme</td>
                <td th:text="${#numbers.formatCurrency(salesOrder.total)}">$0</td>
                <td th:text="${salesOrder.status.name()}">PENDING</td>
                <td><a th:href="@{/sales-orders/{orderId}(orderId=${salesOrder.id})}" class="btn btn-outline-secondary">详情</a></td>
                <td>
                    <a th:if="${salesOrder.status.name() == 'PENDING'}"
                       th:href="@{|/sales-orders/${salesOrder.id}/update|}" class="btn btn-outline-success">编辑</a>
                    <form th:if="${salesOrder.status.name() != 'SHIPPED'}"
                          th:action="@{/sales-orders/{orderId}(orderId=${salesOrder.id})}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-dark" name="delete">删除</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
    <div th:replace="~{fragments/pagination :: pagination(page=${page}, baseUrl='/sales-orders')}"></div>
</div>

<!-- ====== Advanced search modal ====== -->
<div class="modal fade" id="advancedSearchModal" tabindex="-1" aria-labelledby="advancedSearchModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="advancedSearchModalLabel"><i class="bi bi-funnel me-2"></i>高级搜索 - 销售订单</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form th:action="@{/sales-orders}" method="get" th:object="${criteria}">
        <div class="modal-body">
          <p class="text-muted small mb-3">所有字段均为可选项，全部留空则显示所有销售订单。多个条件之间使用 AND 组合查询。</p>

          <div class="row g-2 align-items-end mb-3">
            <div class="col-md-3">
              <label class="form-label small mb-1">销售订单编号</label>
              <select class="form-select form-select-sm" th:field="*{idMode}">
                <option th:each="m : ${textModes}" th:value="${m}" th:text="${m.name().replace('_', ' ').toLowerCase()}">开头是</option>
              </select>
            </div>
            <div class="col-md-9">
              <label class="form-label small mb-1">&nbsp;</label>
              <input type="text" class="form-control" th:field="*{id}" placeholder="例如：10">
            </div>
          </div>

          <div class="row g-2 align-items-end mb-3">
            <div class="col-md-3">
              <label class="form-label small mb-1">客户名称</label>
              <select class="form-select form-select-sm" th:field="*{customerMode}">
                <option th:each="m : ${textModes}" th:value="${m}" th:text="${m.name().replace('_', ' ').toLowerCase()}">包含</option>
              </select>
            </div>
            <div class="col-md-9">
              <label class="form-label small mb-1">&nbsp;</label>
              <input type="text" class="form-control" th:field="*{customer}" placeholder="例如：Acme">
            </div>
          </div>

          <div class="row g-2 align-items-end mb-3">
            <div class="col-md-6">
              <label class="form-label small mb-1">开始日期</label>
              <input type="date" class="form-control" th:field="*{dateFrom}">
            </div>
            <div class="col-md-6">
              <label class="form-label small mb-1">结束日期</label>
              <input type="date" class="form-control" th:field="*{dateTo}">
            </div>
          </div>

          <div class="row g-2 align-items-end">
            <div class="col-md-6">
              <label class="form-label small mb-1">状态</label>
              <select class="form-select" th:field="*{status}">
                <option value="">全部状态</option>
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.name()}">PENDING</option>
              </select>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
          <button type="submit" class="btn btn-dark"><i class="bi bi-search me-1"></i>搜索</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Header fragment -->
<div th:insert="~{fragments/footer :: footer}"></div>
