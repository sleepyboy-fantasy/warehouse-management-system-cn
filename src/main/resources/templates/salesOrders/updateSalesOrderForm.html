<!-- Header -->
<!-- Header fragment -->
<div th:insert="~{fragments/header :: header}"></div>
<!-- Navbar fragment -->
<div th:insert="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="container">
        <div class="container mx-auto col-md-6" id="sale-order-form">
            <div id="header">
                <h1 class="mt-3" th:text="|编辑销售订单: ${persistedOrder.id}|">编辑销售订单</h1>
            </div>

            <div id="updateSalesOrderForm">
                <!-- SALE ORDER FORM -->
                <form action="#" th:action="@{|/sales-orders/${persistedOrder.id}/update|}" th:object="${salesOrder}"
                    method="post" class="row g-3 needs-validation" novalidate>
                    <!-- FROM/TO INPUTS FIELDS-->
                    <div class="col-md-6">
                        <label for="customer" class="form-label">客户</label>
                        <select class="form-select" th:field="*{customer.id}" aria-label="客户选择"
                            th:errorclass="fieldError" id="customer" required name="customer">
                            <option value="" selected th:text="|${salesOrder.customer.id} - ${salesOrder.customer.name}|" th:value="${salesOrder.customer.id}">请选择...</option>
                            <option th:each="customer: ${customers}" th:text="|${customer.id} - ${customer.name}|"
                                th:value="${customer.id}">请选择
                            </option>
                        </select>
                        <div class="invalid-feedback">
                            请选择客户
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label for="date" class="form-label">日期</label>
                        <input class="form-control" type="text" id="date" th:field="*{date}" disabled readonly name="date">
                    </div>

                    <!-- 销售订单明细 -->
                    <!-- <div th:each="saleOrderLine: ${newSalesOrderDto.saleOrderLines}"> -->
                    <div th:each="saleOrderLine, solStat: *{saleOrderLines}">
                        <div class="input-group mb-3">
                            <input type="number" min="1" step="1" th:field="*{saleOrderLines[__${solStat.index}__].qty}"
                                class="form-control" id="qty" th:value="*{saleOrderLines[__${solStat.index}__].qty}">
                            <select class="form-select" th:field="*{saleOrderLines[__${solStat.index}__].item.id}"
                                aria-label="Default select example" id="item" required>
                                <div class="saleOrderLine" th:if="*{saleOrderLines[__${solStat.index}__].item.sku == null}">
                                    <option th:value="" th:text="请选择..." selected disable hidden>请选择...</option>
                                </div>     
                                <div class="saleOrderLine" th:unless="*{saleOrderLines[__${solStat.index}__].item.sku == null}">
                                    <option value="" selected th:text="|*{saleOrderLines[__${solStat.index}__].item.sku} - *{saleOrderLines[__${solStat.index}__].item.description}|" th:value="*{saleOrderLines[__${solStat.index}__].item.id}">Choose...</option>
                                </div>                           
                                <option th:each="item: ${items}"
                                    th:text="|${item.sku} - ${item.description}|" th:value="${item.id}">请选择
                                </option>
                            </select>
                                <button type="submit" name="removeRow" th:value="${solStat.index}" class="btn btn-danger">移除</button>
                        </div>
                    </div>
                    <!-- 添加订单明细按钮 -->
                    <div class="col-12">
                        <button type="submit" name="addRow" value="yes" class="btn btn-primary">添加订单明细</button>
                    </div>
                    <!-- </div> -->
                    <!-- 保存销售订单修改 -->
                    <div class="col-12">
                        <div class="d-grid mx-auto">
                            <button type="submit" name="save" th:value="|yes|" class="btn btn-dark col-12">保存销售订单修改</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<script>

    //提交表单时进行前端数据验证的 JavaScript 代码
    //用于在空白输入字段下方显示提示信息
    (function () {
        'use strict'

        // 获取所有需要应用 Bootstrap 自定义验证样式的表单
        // 检查 class 属性包含 "needs-validation" 的输入表单

        //TODO：将 JavaScript 移动到独立文件
        var forms = document.querySelectorAll('.needs-validation')

        // 遍历这些表单并阻止无效表单提交
        Array.prototype.slice.call(forms)
            .forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }

                    form.classList.add('was-validated')
                }, false)
            })
    })()
</script>


<!-- Footer fragment -->
<div th:insert="~{fragments/footer :: footer}"></div>
