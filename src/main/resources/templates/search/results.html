<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:insert="~{fragments/header :: header}"></div>
<div th:insert="~{fragments/navbar :: navbar}"></div>

<div class="container-fluid px-4 py-3">
    <h1 class="my-3">
        搜索结果
        <small class="text-muted" th:if="${!#strings.isEmpty(query)}" th:text="|搜索“${query}”的结果|"></small>
    </h1>

    <!-- 优化搜索：设置搜索词和匹配模式，提交后使用两个查询参数重新加载页面 -->
    <form th:action="@{/search}" method="get" class="card shadow-sm mb-3">
        <div class="card-body row g-2 align-items-end">
            <div class="col-md-7">
                <label class="form-label small mb-1">搜索词</label>
                <input class="form-control" type="search" name="q" th:value="${query}"
                       placeholder="搜索商品、客户、供应商..."
                       data-autocomplete-source="ITEM"
                       th:attr="data-autocomplete-mode=${mode}"
                       data-autocomplete-fill-on-select="true">
            </div>
            <div class="col-md-3">
                <label class="form-label small mb-1">匹配方式</label>
                <select class="form-select" name="mode">
                    <option value="CONTAINS"    th:selected="${mode != null and mode.name() == 'CONTAINS'}">包含</option>
                    <option value="STARTS_WITH" th:selected="${mode != null and mode.name() == 'STARTS_WITH'}">以...开头</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label small mb-1">&nbsp;</label>
                <button type="submit" class="btn btn-dark w-100">搜索</button>
            </div>
        </div>
    </form>

    <div th:if="${#strings.isEmpty(query)}" class="alert alert-info">
        输入搜索词并选择匹配方式，以查找商品、客户或供应商。
    </div>

    <!-- 商品 -->
    <div class="card shadow-sm mb-3" th:if="${!#strings.isEmpty(query)}">
        <div class="card-body">
            <h5 class="card-title">
                <i class="bi bi-box me-1"></i>商品
                <span class="text-muted small" th:text="|(${items.size()})|"></span>
            </h5>
            <div th:if="${items.isEmpty()}" class="text-muted small">没有找到匹配的商品。</div>
            <table th:unless="${items.isEmpty()}" class="table table-sm align-middle mb-0">
                <thead><tr><th>商品编号</th><th>描述</th><th>供应商</th><th></th></tr></thead>
                <tbody>
                <tr th:each="item : ${items}">
                    <td th:text="${item.sku}">100</td>
                    <td th:text="${item.description}">Widget</td>
                    <td th:text="${item.vendor != null} ? ${item.vendor.name} : ''">Acme</td>
                    <td><a th:href="@{|/items/${item.id}|}" class="btn btn-outline-secondary btn-sm">详情</a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 客户 -->
    <div class="card shadow-sm mb-3" th:if="${!#strings.isEmpty(query)}">
        <div class="card-body">
            <h5 class="card-title">
                <i class="bi bi-people me-1"></i>客户
                <span class="text-muted small" th:text="|(${customers.size()})|"></span>
            </h5>
            <div th:if="${customers.isEmpty()}" class="text-muted small">没有找到匹配的客户。</div>
            <table th:unless="${customers.isEmpty()}" class="table table-sm align-middle mb-0">
                <thead><tr><th>姓名</th><th>城市</th><th>州/省</th><th></th></tr></thead>
                <tbody>
                <tr th:each="c : ${customers}">
                    <td th:text="${c.name}">Bob</td>
                    <td th:text="${c.city}">Jersey City</td>
                    <td th:text="${c.state}">NJ</td>
                    <td><a th:href="@{|/customers/${c.id}|}" class="btn btn-outline-secondary btn-sm">详情</a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 供应商 -->
    <div class="card shadow-sm mb-3" th:if="${!#strings.isEmpty(query)}">
        <div class="card-body">
            <h5 class="card-title">
                <i class="bi bi-truck me-1"></i>供应商
                <span class="text-muted small" th:text="|(${vendors.size()})|"></span>
            </h5>
            <div th:if="${vendors.isEmpty()}" class="text-muted small">没有找到匹配的供应商。</div>
            <table th:unless="${vendors.isEmpty()}" class="table table-sm align-middle mb-0">
                <thead><tr><th>姓名</th><th>城市</th><th>州/省</th><th></th></tr></thead>
                <tbody>
                <tr th:each="v : ${vendors}">
                    <td th:text="${v.name}">Acme</td>
                    <td th:text="${v.city}">Boise</td>
                    <td th:text="${v.state}">ID</td>
                    <td><a th:href="@{|/vendors/${v.id}|}" class="btn btn-outline-secondary btn-sm">详情</a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:insert="~{fragments/footer :: footer}"></div>
</html>
