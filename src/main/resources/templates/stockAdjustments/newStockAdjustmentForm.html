<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:insert="~{fragments/header :: header}"></div>
<div th:insert="~{fragments/navbar :: navbar}"></div>

<div class="container-fluid px-4 py-3" style="max-width: 720px;">
    <div th:if="${param.failed}" class="alert alert-danger">无法应用该库存调整（可能是调整数量超过现有库存）。</div>
    <div th:if="${param.invalid}" class="alert alert-warning">缺少商品或来源库位信息。</div>

    <h1 class="my-3">新增库存调整</h1>

    <form th:action="@{/stock-adjustments/new}" th:object="${stockAdjustment}" method="post" class="card shadow-sm">
        <div class="card-body row g-3">
            <div class="col-md-4">
                <label class="form-label">调整类型</label>
                <select class="form-select" th:field="*{type}">
                    <option th:each="t : ${types}" th:value="${t}" th:text="${t.name()}">CYCLE_COUNT</option>
                </select>
                <div class="form-text">
                    <strong>CYCLE_COUNT</strong>：将来源库位的库存数量设置为新值。<br>
                    <strong>DAMAGE</strong> / <strong>TRANSFER</strong>：将指定数量从来源库位移动到目标库位。<br>
                    <strong>WRITE_OFF</strong>：从来源库位扣减指定数量。
                </div>
            </div>

            <div class="col-md-8">
                <label class="form-label">商品</label>
                <select class="form-select" th:field="*{item.id}" required>
                    <option value="" disabled selected>— 请选择商品 —</option>
                    <option th:each="i : ${items}" th:value="${i.id}"
                            th:text="|${i.sku} — ${i.description}|">100 — Widget</option>
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label">来源库位</label>
                <select class="form-select" th:field="*{source.id}" required>
                    <option value="" disabled selected>— 请选择库位 —</option>
                    <option th:each="s : ${sections}" th:value="${s.id}" th:text="${s.sectionNumber}">AA-01-1-A</option>
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label">目标库位 <span class="text-muted small">（转移 / 损坏）</span></label>
                <select class="form-select" th:field="*{destination.id}">
                    <option value="">— 无 —</option>
                    <option th:each="s : ${sections}" th:value="${s.id}" th:text="${s.sectionNumber}">AA-01-2-A</option>
                </select>
            </div>

            <div class="col-md-3">
                <label class="form-label">数量</label>
                <input type="number" min="0" class="form-control" th:field="*{qty}" required>
            </div>

            <div class="col-md-3">
                <label class="form-label">日期</label>
                <input type="date" class="form-control" th:field="*{adjustmentDate}">
            </div>

            <div class="col-md-6">
                <label class="form-label">备注</label>
                <input type="text" class="form-control" th:field="*{notes}" maxlength="255" placeholder="可填写调整原因...">
            </div>

            <div class="col-12 d-flex justify-content-end gap-2">
                <a class="btn btn-outline-secondary" href="/stock-adjustments">取消</a>
                <button type="submit" class="btn btn-dark">应用调整</button>
            </div>
        </div>
    </form>
</div>

<div th:insert="~{fragments/footer :: footer}"></div>
</html>
