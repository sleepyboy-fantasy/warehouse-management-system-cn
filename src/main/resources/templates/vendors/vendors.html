<!-- Header -->
<!-- Header fragment -->
<div th:insert="~{fragments/header :: header}"></div>
<!-- Navbar fragment -->
<div th:insert="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <!-- ALERTS TO PROVIDE USER FEEDBACK ON SUCCESSFUL vendor DELETION -->
    <div th:if="${param.deleted}">
        <div class="alert alert-success alert-dismissible fade show my-3" role="alert">
            供应商删除成功
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>
     <!-- ALERTS TO PROVIDE USER FEEDBACK ON UNSUCCESSFUL vendor DELETION -->
     <div th:if="${param.failedToDelete}">
        <div class="alert alert-danger alert-dismissible fade show my-3" role="alert">
            无法删除已开票供应商
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>
    <!-- ALERTS TO PROVIDE USER FEEDBACK ON vendor NOT FOUND -->
    <div th:if="${param.notFound}">
        <div class="alert alert-info alert-dismissible fade show my-3" role="alert">
            未找到供应商信息
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>
    <!-- Page headers -->
    <div class="d-flex justify-content-between align-items-center my-3">
        <h1 class="m-0">供应商列表</h1>
        <a class="btn btn-dark" th:href="@{/vendors/new-vendor}">
            <i class="bi bi-plus-lg me-1"></i>新增供应商
        </a>
    </div>

    <!-- Simple search bar (binds to criteria.name) + Advanced button -->
    <form th:action="@{/vendors}" method="get" th:object="${criteria}" class="card shadow-sm mb-3">
        <div class="card-body row g-2 align-items-end">
            <div class="col-md-8">
                <label class="form-label small mb-1">按供应商名称搜索</label>
                <input type="search" class="form-control" th:field="*{name}"
                       placeholder="请输入供应商名称..."
                       data-autocomplete-source="VENDOR"
                       data-autocomplete-mode="CONTAINS"
                       data-autocomplete-fill-on-select="true">
                <input type="hidden" th:field="*{nameMode}">
                <input type="hidden" th:field="*{id}">
                <input type="hidden" th:field="*{idMode}">
                <input type="hidden" th:field="*{city}">
                <input type="hidden" th:field="*{cityMode}">
                <input type="hidden" th:field="*{state}">
                <input type="hidden" th:field="*{stateMode}">
            </div>
            <div class="col-md-4 d-flex gap-2">
                <button type="submit" class="btn btn-dark flex-grow-1">
                    <i class="bi bi-search me-1"></i>搜索
                </button>
                <button type="button" class="btn btn-outline-secondary"
                        data-bs-toggle="modal" data-bs-target="#advancedSearchModal">
                    <i class="bi bi-funnel me-1"></i>高级搜索
                </button>
            </div>
        </div>
    </form>

    <div th:if="${criteria.isActive()}" class="d-flex justify-content-between align-items-center mb-2">
        <span class="text-muted small"
              th:text="|已筛选：${page.totalElements} 条匹配记录|">已筛选：3 条匹配记录</span>
        <a th:href="@{/vendors}" class="btn btn-link btn-sm">
            <i class="bi bi-x-circle me-1"></i>清除筛选
        </a>
    </div>

    <!-- vendor list as table -->
    <table class="table">
        <thead>
            <tr>
                <th th:replace="~{fragments/pagination :: sortHeader(label='编号', property='id', page=${page}, baseUrl='/vendors')}"></th>
                <th th:replace="~{fragments/pagination :: sortHeader(label='供应商名称', property='name', page=${page}, baseUrl='/vendors')}"></th>
                <th th:replace="~{fragments/pagination :: sortHeader(label='街道地址', property='street', page=${page}, baseUrl='/vendors')}"></th>
                <th th:replace="~{fragments/pagination :: sortHeader(label='城市', property='city', page=${page}, baseUrl='/vendors')}"></th>
                <th th:replace="~{fragments/pagination :: sortHeader(label='地区', property='state', page=${page}, baseUrl='/vendors')}"></th>
                <th th:replace="~{fragments/pagination :: sortHeader(label='邮编', property='zipcode', page=${page}, baseUrl='/vendors')}"></th>
                <th scope="col"></th>
                <th scope="col"></th>
                <th scope="col"></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="vendor : ${page.content}">
                <th scope="row" th:text="${vendor.id}">1</th>
                <td th:text="${vendor.name}">Mark</td>
                <td th:text="${vendor.street}">Otto</td>
                <td th:text="${vendor.city}">@mdo</td>
                <td th:text="${vendor.state}">@mdo</td>
                <td th:text="${vendor.zipcode}">@mdo</td>
                <td><a th:href="@{|/vendors/${vendor.id}|}" class="btn btn-outline-secondary col-12">详情</a></td>
                <td><a th:href="@{|/vendors/${vendor.id}/update|}" class="btn btn-outline-success col-12">编辑</a></td>
                <td>
                    <form th:action="@{/vendors/{id}(id=${vendor.id})}" method="POST">
                        <button type="submit" class="btn btn-dark col-12" name="delete">删除</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
    <div th:replace="~{fragments/pagination :: pagination(page=${page}, baseUrl='/vendors')}"></div>
</div>

<!-- ====== Advanced search modal ====== -->
<div class="modal fade" id="advancedSearchModal" tabindex="-1" aria-labelledby="advancedSearchModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="advancedSearchModalLabel"><i class="bi bi-funnel me-2"></i>高级搜索 - 供应商</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form th:action="@{/vendors}" method="get" th:object="${criteria}">
        <div class="modal-body">
          <p class="text-muted small mb-3">所有字段均为可选项，留空则显示全部供应商。多个条件之间使用 AND 组合查询。</p>

          <div class="row g-2 align-items-end mb-3">
            <div class="col-md-3">
              <label class="form-label small mb-1">供应商编号</label>
              <select class="form-select form-select-sm" th:field="*{idMode}">
                <option th:each="m : ${textModes}" th:value="${m}" th:text="${m.name().replace('_', ' ').toLowerCase()}">starts with</option>
              </select>
            </div>
            <div class="col-md-9">
              <label class="form-label small mb-1">&nbsp;</label>
              <input type="text" class="form-control" th:field="*{id}" placeholder="例如：10">
            </div>
          </div>

          <div class="row g-2 align-items-end mb-3">
            <div class="col-md-3">
              <label class="form-label small mb-1">供应商名称</label>
              <select class="form-select form-select-sm" th:field="*{nameMode}">
                <option th:each="m : ${textModes}" th:value="${m}" th:text="${m.name().replace('_', ' ').toLowerCase()}">contains</option>
              </select>
            </div>
            <div class="col-md-9">
              <label class="form-label small mb-1">&nbsp;</label>
              <input type="text" class="form-control" th:field="*{name}" placeholder="例如：苹果公司">
            </div>
          </div>

          <div class="row g-2 align-items-end mb-3">
            <div class="col-md-3">
              <label class="form-label small mb-1">City</label>
              <select class="form-select form-select-sm" th:field="*{cityMode}">
                <option th:each="m : ${textModes}" th:value="${m}" th:text="${m.name().replace('_', ' ').toLowerCase()}">contains</option>
              </select>
            </div>
            <div class="col-md-9">
              <label class="form-label small mb-1">&nbsp;</label>
              <input type="text" class="form-control" th:field="*{city}" placeholder="例如：上海">
            </div>
          </div>

          <div class="row g-2 align-items-end">
            <div class="col-md-3">
              <label class="form-label small mb-1">State</label>
              <select class="form-select form-select-sm" th:field="*{stateMode}">
                <option th:each="m : ${textModes}" th:value="${m}" th:text="${m.name().replace('_', ' ').toLowerCase()}">contains</option>
              </select>
            </div>
            <div class="col-md-9">
              <label class="form-label small mb-1">&nbsp;</label>
              <input type="text" class="form-control" th:field="*{state}" placeholder="例如：安徽">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
          <button type="submit" class="btn btn-dark"><i class="bi bi-search me-1"></i>搜索</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Footer fragment -->
<div th:insert="~{fragments/footer :: footer}"></div>
